# Commit hooks block secrets and cheap file-hygiene mistakes. The pre-push hook
# runs the canonical local quality and security gates outside the edit loop.
#
# Setup:
#   make bootstrap
#
# Run against all files on demand:
#   pre-commit run --all-files
default_stages: [pre-commit]

repos:
  # Use the locally installed gitleaks binary (brew) so no Go build is required.
  - repo: local
    hooks:
      - id: gitleaks
        name: Detect hardcoded secrets (gitleaks)
        entry: gitleaks protect --staged --redact
        language: system
        pass_filenames: false

      - id: ancestryllm-pre-push
        name: Run canonical local gates before push
        entry: make pre-push
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: ancestryllm-lockfile-consistency
        name: Check uv lockfile consistency
        entry: make lock-check
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock)$

      - id: ancestryllm-workflow-audit
        name: Audit changed GitHub Actions workflows
        entry: make workflow-audit
        language: system
        pass_filenames: false
        files: ^\.github/workflows/
        stages: [pre-push]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: no-commit-to-branch
        args: ["--branch", "main"]
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: mixed-line-ending
        args: ["--fix=lf"]
