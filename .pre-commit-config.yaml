# Commit hooks block secrets and cheap file-hygiene mistakes. The pre-push hook
# runs the canonical local quality and security gates outside the edit loop.
#
# Setup:
#   make bootstrap
#
# Run against all files on demand:
#   pre-commit run --all-files
default_stages: [pre-commit]

repos:
  # Use the locally installed gitleaks binary (brew) so no Go build is required.
  - repo: local
    hooks:
      - id: gitleaks
        name: Detect hardcoded secrets (gitleaks)
        entry: gitleaks protect --staged --redact
        language: system
        pass_filenames: false

      - id: ancestryllm-pre-push
        name: Run canonical local gates before push
        entry: make pre-push
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: ancestryllm-workflow-audit
        name: Audit changed GitHub Actions workflows
        entry: make workflow-audit
        language: system
        pass_filenames: false
        files: ^\.github/(actions|workflows)/
        stages: [pre-push]

  # Commit corresponds to Ruff 0.16.1, matching the locked lint tool.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 39d9ac5938dadb73df0564a45f163e25ff9fa6e2
    hooks:
      - id: ruff-check
        args: ["--no-fix"]
        files: ^(src|tests|scripts)/
      - id: ruff-format
        args: ["--check"]
        files: ^(src|tests|scripts)/

  # Commit corresponds to the repository's verified uv 0.12.1 contract.
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 8ff2449591c8de025b17661ba76d60237a1ae62b
    hooks:
      - id: uv-lock
        args: ["--check"]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: no-commit-to-branch
        args: ["--branch", "main"]
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: mixed-line-ending
        args: ["--fix=lf"]
