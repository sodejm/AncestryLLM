# THIS IS AUTOGENERATED. DO NOT EDIT MANUALLY
version = 1
name = "AncestryLLM"

[setup]
script = ""

[setup.darwin]
script = '''
set -euo pipefail

if [ ! -f Makefile ] || [ ! -f pyproject.toml ] || [ ! -f desktop/package.json ]; then
  echo "This must run from the AncestryLLM project root." >&2
  exit 1
fi

if [ "$(uname -m)" != "arm64" ]; then
  echo "This local environment is configured for Apple-silicon macOS." >&2
  exit 1
fi

runtime_root="${HOME}/Library/Caches/AncestryLLM/local-environment"
node_version="26.5.0"
pnpm_version="11.9.0"
node_bundle="node-v${node_version}-darwin-arm64"
node_root="${runtime_root}/${node_bundle}"
pnpm_root="${runtime_root}/pnpm-${pnpm_version}"

export UV_CACHE_DIR="${runtime_root}/uv-cache"
export NPM_CONFIG_CACHE="${runtime_root}/npm-cache"
export NPM_CONFIG_UPDATE_NOTIFIER=false
mkdir -p "$runtime_root" "$UV_CACHE_DIR" "$NPM_CONFIG_CACHE"

if [ ! -x "${node_root}/bin/node" ]; then
  archive="${runtime_root}/${node_bundle}.tar.xz"
  checksums="${runtime_root}/SHASUMS256.txt"

  curl --fail --location --retry 3 --silent --show-error \
    --output "$archive" \
    "https://nodejs.org/dist/v${node_version}/${node_bundle}.tar.xz"
  curl --fail --location --retry 3 --silent --show-error \
    --output "$checksums" \
    "https://nodejs.org/dist/v${node_version}/SHASUMS256.txt"

  (
    cd "$runtime_root"
    grep -F "  ${node_bundle}.tar.xz" "$checksums" | shasum -a 256 -c -
  )

  tar -xJf "$archive" -C "$runtime_root"
fi

export PATH="${node_root}/bin:${PATH}"

if [ ! -x "${pnpm_root}/node_modules/.bin/pnpm" ]; then
  npm install \
    --prefix "$pnpm_root" \
    --no-save \
    --ignore-scripts \
    --no-audit \
    --no-fund \
    "pnpm@${pnpm_version}"
fi

export PATH="${node_root}/bin:${pnpm_root}/node_modules/.bin:${PATH}"
hash -r

test "$(node --version)" = "v${node_version}"
test "$(pnpm --version)" = "${pnpm_version}"

make setup
make desktop-install'''

[[actions]]
name = "Test"
icon = "tool"
command = '''
set -euo pipefail
export UV_CACHE_DIR="${HOME}/Library/Caches/AncestryLLM/local-environment/uv-cache"
mkdir -p "$UV_CACHE_DIR"
make test'''
platform = "darwin"

[[actions]]
name = "Quality"
icon = "tool"
command = '''
set -euo pipefail
export UV_CACHE_DIR="${HOME}/Library/Caches/AncestryLLM/local-environment/uv-cache"
mkdir -p "$UV_CACHE_DIR"
make lint
make typecheck'''

[[actions]]
name = "Security"
icon = "tool"
command = '''
set -euo pipefail
export UV_CACHE_DIR="${HOME}/Library/Caches/AncestryLLM/local-environment/uv-cache"
mkdir -p "$UV_CACHE_DIR"
make security'''

[[actions]]
name = "Lock Check"
icon = "tool"
command = '''
set -euo pipefail
export UV_CACHE_DIR="${HOME}/Library/Caches/AncestryLLM/local-environment/uv-cache"
mkdir -p "$UV_CACHE_DIR"
make lock-check'''

[[actions]]
name = "Desktop"
icon = "tool"
command = '''
set -euo pipefail

runtime_root="${HOME}/Library/Caches/AncestryLLM/local-environment"
export PATH="${runtime_root}/node-v26.5.0-darwin-arm64/bin:${runtime_root}/pnpm-11.9.0/node_modules/.bin:${PATH}"

test "$(node --version)" = "v26.5.0"
test "$(pnpm --version)" = "11.9.0"

make desktop-check'''

[[actions]]
name = "Cleanup Review"
icon = "tool"
command = '''
set -euo pipefail

git status --short
git worktree list --porcelain
git branch -vv
git branch --merged origin/main'''
