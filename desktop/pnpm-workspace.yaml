# Defines the frozen single-package pnpm workspace and reviewed dependency overrides.
autoInstallPeers: false
enablePrePostScripts: false
engineStrict: true
ignoreScripts: false
saveExact: true
sharedWorkspaceLockfile: false
overrides:
  '@wdio/mocha-framework>mocha': 11.8.0
  'mocha>diff': 8.0.3
  'glob@>=9.0.0 <=14.0.1': 14.0.6
  'minimatch@>=7.0.0 <11.0.1': 11.0.9
  '@electron/get@3>global-agent': '-'
  fast-uri: 3.1.9
  'undici@^6': 6.29.1
  'undici@^7': 7.30.1
  'zod@^4': 4.6.6
  deepmerge-ts: 8.0.2
  js-yaml@4.3.0: 4.3.2
  '@xmldom/xmldom@0.8.13': 0.8.15
  serialize-javascript: 7.1.3
  tsx: 4.23.15
onlyBuiltDependencies:
  - electron
  - esbuild
ignoredBuiltDependencies:
  - edgedriver
  - electron-winstaller
  - geckodriver
  - libxmljs2
allowBuilds:
  edgedriver: false
  electron: true
  electron-winstaller: false
  esbuild: true
  geckodriver: false
  libxmljs2: false
