# Defines the frozen single-package pnpm workspace and reviewed dependency overrides.
packages:
  - '.'
autoInstallPeers: false
enablePrePostScripts: false
engineStrict: true
ignoreScripts: false
saveExact: true
sharedWorkspaceLockfile: false
overrides:
  extract-zip: npm:@electron-internal/extract-zip@1.0.5
  fast-uri: 3.1.8
  deepmerge-ts: 8.0.0
  js-yaml@4.3.0: 4.3.2
  '@xmldom/xmldom@0.8.13': 0.8.15
  nanoid@<3.3.18: 3.3.18
  serialize-javascript: 7.0.3
  tsx: 4.21.1
  undici@6.28.0: 6.28.1
  undici@7.29.0: 7.29.1
  brace-expansion@1.1.18: 1.1.21
  brace-expansion@2.1.4: 2.1.7
  brace-expansion@5.0.9: 5.0.12
onlyBuiltDependencies:
  - electron
  - esbuild
ignoredBuiltDependencies:
  - edgedriver
  - electron-winstaller
  - geckodriver
  - libxmljs2
allowBuilds:
  edgedriver: false
  electron: true
  electron-winstaller: false
  esbuild: true
  geckodriver: false
  libxmljs2: false
