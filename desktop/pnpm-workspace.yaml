# Defines the frozen single-package pnpm workspace and reviewed dependency overrides.
autoInstallPeers: false
enablePrePostScripts: false
engineStrict: true
ignoreScripts: false
saveExact: true
sharedWorkspaceLockfile: false
overrides:
  '@puppeteer/browsers>extract-zip': npm:@electron-internal/extract-zip@1.0.5
  'get-uri>basic-ftp': 6.2.1
  '@wdio/mocha-framework>mocha': 11.8.0
  'mocha>diff': 8.0.3
  '@electron/get@3>global-agent': '-'
  fast-uri: 3.1.8
  deepmerge-ts: 8.0.2
  js-yaml@4.3.0: 4.3.2
  '@xmldom/xmldom@0.8.13': 0.8.15
  nanoid@<3.3.18: 3.3.18
  serialize-javascript: 7.0.5
  tsx: 4.23.15
packageExtensions:
  '@wdio/electron-service@10.3.0':
    dependencies:
      expect-webdriverio: 5.6.5
onlyBuiltDependencies:
  - electron
  - esbuild
ignoredBuiltDependencies:
  - edgedriver
  - electron-winstaller
  - geckodriver
  - libxmljs2
allowBuilds:
  edgedriver: false
  electron: true
  electron-winstaller: false
  esbuild: true
  geckodriver: false
  libxmljs2: false
