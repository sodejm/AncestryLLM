# Defines the frozen single-package pnpm workspace and reviewed dependency overrides.
autoInstallPeers: false
enablePrePostScripts: false
engineStrict: true
ignoreScripts: false
saveExact: true
sharedWorkspaceLockfile: false
overrides:
  extract-zip: npm:@electron-internal/extract-zip@1.0.5
  fast-uri: 3.1.5
  js-yaml@4.3.0: 4.3.1
  nanoid@<3.3.18: 3.3.18
onlyBuiltDependencies:
  - electron
  - esbuild
ignoredBuiltDependencies:
  - electron-winstaller
  - libxmljs2
allowBuilds:
  electron: true
  electron-winstaller: false
  esbuild: true
  libxmljs2: false
patchedDependencies:
  electron@39.8.10: patches/electron@39.8.10.patch
