# pnpm workspace/install policy for the desktop package: pins build script
# execution to an explicit allowlist so postinstall scripts stay auditable.
autoInstallPeers: false
enablePrePostScripts: false
engineStrict: true
ignoreScripts: false
saveExact: true
sharedWorkspaceLockfile: false
overrides:
  fast-uri: 3.1.5
onlyBuiltDependencies:
  - electron
  - esbuild
ignoredBuiltDependencies:
  - electron-winstaller
  - libxmljs2
allowBuilds:
  electron: true
  electron-winstaller: false
  esbuild: true
  libxmljs2: false
