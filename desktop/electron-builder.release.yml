appId: org.ancestryllm.desktop
productName: AncestryLLM
executableName: ancestryllm
asar: true
directories:
  output: release-installers
files:
  - out/**/*
  - package.json
extraResources:
  - from: build/sidecar
    to: sidecar
  - from: resources/macos-arm64-runtime-policy-v1.json
    to: runtime-policy/macos-arm64-runtime-policy-v1.json
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  loadBrowserProcessSpecificV8Snapshot: false
  grantFileProtocolExtraPrivileges: false
artifactName: AncestryLLM-${version}-${os}-${arch}.${ext}
publish: null
generateUpdatesFilesForAllChannels: false
mac:
  target: dmg
  category: public.app-category.productivity
  # Pre-1.0 release builds are unsigned by default. The release workflow
  # overrides this to true for v1.0.0 and later.
  forceCodeSigning: false
  hardenedRuntime: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  notarize: false
win:
  target:
    - target: nsis
      arch:
        - arm64
  # Keep resedit enabled so the application name, icon, version, and execution
  # level replace the upstream Electron executable resources. Disable only the
  # signing phase until v1.0.0.
  signAndEditExecutable: true
  signExecutable: false
  forceCodeSigning: false
linux:
  target:
    - target: deb
      arch:
        - x64
  category: Utility
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  differentialPackage: false
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
