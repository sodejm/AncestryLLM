# Signed/notarizable installer overlay of electron-builder.yml for tagged
# releases: dmg/nsis/deb artifacts with per-OS code-signing toggles.
appId: org.ancestryllm.desktop
productName: AncestryLLM
executableName: ancestryllm
asar: true
directories:
  output: release-installers
files:
  - out/**/*
  - package.json
extraResources:
  - from: build/sidecar
    to: sidecar
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  loadBrowserProcessSpecificV8Snapshot: false
  grantFileProtocolExtraPrivileges: false
artifactName: AncestryLLM-${version}-${os}-${arch}.${ext}
publish: null
generateUpdatesFilesForAllChannels: false
mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  category: public.app-category.productivity
  # Pre-1.0 release builds are unsigned by default. The release workflow
  # overrides this to true for v1.0.0 and later.
  forceCodeSigning: false
  hardenedRuntime: true
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  notarize: false
win:
  target:
    - target: nsis
      arch:
        - x64
  signAndEditExecutable: true
  # Pre-1.0 release builds are unsigned by default. The release workflow
  # overrides this to true for v1.0.0 and later.
  forceCodeSigning: false
linux:
  target:
    - target: deb
      arch:
        - x64
  category: Utility
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  differentialPackage: false
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
