# CI-only overlay for an unpublished unpacked verification application.
# Re-sign the fuse-mutated macOS bundle ad hoc so the hosted runner can launch
# it. Preserve the manifest-bound sidecar bytes by excluding only that payload
# from Electron's second signing pass; PyInstaller has already signed its Mach-O
# files and the outer application signature still seals the resource tree.
# Release identity and notarization evidence remain external work (#231).
extends: ./electron-builder.yml
mac:
  identity: "-"
  signIgnore:
    - "/Contents/Resources/sidecar/"
