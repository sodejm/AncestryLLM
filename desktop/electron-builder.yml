# Configures the hardened desktop application package and bundled sidecar resources.
appId: org.ancestryllm.desktop
productName: AncestryLLM
executableName: ancestryllm
asar: true
directories:
  output: release
files:
  - out/**/*
  - package.json
extraResources:
  - from: build/sidecar
    to: sidecar
  - from: resources/macos-arm64-runtime-policy-v1.json
    to: runtime-policy/macos-arm64-runtime-policy-v1.json
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  loadBrowserProcessSpecificV8Snapshot: false
  grantFileProtocolExtraPrivileges: false
mac:
  target:
    - dir
  category: public.app-category.productivity
  identity: null
win:
  target:
    - dir
linux:
  target:
    - dir
  category: Utility
