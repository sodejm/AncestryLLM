# Remote-host resource-limit overrides; merged on top of compose.yaml.
# See docs/DEPLOYMENT.md for profile usage and constraint explanations.
{
  "services": {
    "gateway": {
      "cpus": 4.0,
      "mem_limit": "8g",
      "pids_limit": 512,
      "labels": {"org.ancestryllm.deployment-profile": "host-remote"}
    },
    "worker": {
      "cpus": 4.0,
      "mem_limit": "8g",
      "pids_limit": 512,
      "labels": {"org.ancestryllm.deployment-profile": "host-remote"}
    }
  }
}
