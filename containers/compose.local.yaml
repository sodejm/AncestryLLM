# Local-desktop resource-limit overrides; merged on top of compose.yaml.
# See docs/DEPLOYMENT.md for profile usage and constraint explanations.
{
  "services": {
    "gateway": {
      "cpus": 2.0,
      "mem_limit": "4g",
      "pids_limit": 256,
      "labels": {"org.ancestryllm.deployment-profile": "local-desktop"}
    },
    "worker": {
      "cpus": 2.0,
      "mem_limit": "4g",
      "pids_limit": 256,
      "labels": {"org.ancestryllm.deployment-profile": "local-desktop"}
    }
  }
}
