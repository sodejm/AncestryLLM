<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-US' }}">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="ancestryllm-source-commit" content="{{ site.data.build.source_sha }}">
    {% seo %}
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/documentation.css?v=' | append: site.github.build_revision | relative_url }}">
  </head>
  <body>
    <a id="skip-to-content" href="#main-content">Skip to the content.</a>
    <main id="content" class="main-content" role="main">
      <div class="documentation-shell">
        <aside class="documentation-navigation" aria-label="Documentation navigation">
          {% capture sidebar %}{% include sidebar.md %}{% endcapture %}
          {{ sidebar | markdownify }}
        </aside>
        <article class="documentation-content" id="main-content">
          {{ content }}
        </article>
      </div>
    </main>
  </body>
</html>
