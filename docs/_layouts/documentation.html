<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-US' }}">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="ancestryllm-source-commit" content="{{ site.data.build.source_sha }}">
    {% seo %}
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
    <style>
      .documentation-shell { display: grid; gap: 2rem; grid-template-columns: minmax(15rem, 20rem) minmax(0, 1fr); }
      .documentation-navigation { font-size: 0.9rem; }
      .documentation-navigation ul { margin: 0; padding-left: 1.2rem; }
      .documentation-content { min-width: 0; }
      @media (max-width: 48rem) { .documentation-shell { display: block; } .documentation-navigation { margin-bottom: 2rem; } }
    </style>
  </head>
  <body>
    <a id="skip-to-content" href="#main-content">Skip to the content.</a>
    <main id="content" class="main-content" role="main">
      <div class="documentation-shell">
        <aside class="documentation-navigation" aria-label="Documentation navigation">
          {% capture sidebar %}{% include sidebar.md %}{% endcapture %}
          {{ sidebar | markdownify }}
        </aside>
        <article class="documentation-content" id="main-content">
          {{ content }}
        </article>
      </div>
    </main>
  </body>
</html>
