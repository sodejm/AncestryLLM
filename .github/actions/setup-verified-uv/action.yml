# Verify the pinned uv release before exposing it to repository workflows.
name: Set up verified uv
description: Verify uv release provenance and digests before repository commands run.

inputs:
  python-version:
    description: Kept for caller compatibility; no longer consumed by this action.
    required: true
  receipt-artifact-name:
    description: Unique artifact name for the schema-v1 verification receipt.
    required: false
    default: uv-bootstrap-receipt

outputs:
  receipt-path:
    description: Repository-relative path to the schema-v1 verification receipt.
    value: ${{ steps.receipt.outputs.receipt_path }}
  uv-path:
    description: Path to the verified bootstrapped uv binary.
    value: ${{ steps.bootstrap-path.outputs.uv_path }}

runs:
  using: composite
  steps:
    - name: Select the verification receipt path
      id: receipt
      shell: bash
      run: |
        mkdir -p .tools/receipts
        echo "receipt_path=.tools/receipts/uv-bootstrap.json" >> "$GITHUB_OUTPUT"

    - name: Verify release provenance and bootstrap repository-local uv
      id: preflight
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: >-
        python scripts/bootstrap_uv.py bootstrap
        --receipt "${{ steps.receipt.outputs.receipt_path }}"
        --platform "${{ runner.os }}"
        --architecture "${{ runner.arch }}"
        --github-output "$GITHUB_OUTPUT"

    - name: Resolve bootstrapped uv path
      id: bootstrap-path
      shell: bash
      run: |
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          echo "uv_path=.tools/uv/uv.exe" >> "$GITHUB_OUTPUT"
        else
          echo "uv_path=.tools/uv/uv" >> "$GITHUB_OUTPUT"
        fi

    - name: Re-hash bootstrapped binary before first execution
      shell: bash
      run: >-
        python scripts/bootstrap_uv.py verify-installed
        --uv-path "${{ steps.bootstrap-path.outputs.uv_path }}"
        --platform "${{ runner.os }}"
        --architecture "${{ runner.arch }}"

    - name: Add bootstrapped uv to PATH
      shell: bash
      run: echo ".tools/uv" >> "$GITHUB_PATH"

    - name: Retain verified bootstrap receipt
      if: ${{ always() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ${{ inputs.receipt-artifact-name }}
        path: ${{ steps.receipt.outputs.receipt_path }}
        if-no-files-found: error
        include-hidden-files: true
        retention-days: 30
