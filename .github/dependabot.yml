# Dependabot update policy: weekly checks with a cooldown to avoid churn from
# just-published releases; see docs/CI.md for the dependency review workflow.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    groups:
      weekly-batch:
        applies-to: version-updates
        patterns:
          - "*"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    groups:
      weekly-batch:
        applies-to: version-updates
        patterns:
          - "*"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
