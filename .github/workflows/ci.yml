name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Cache uv downloads and builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ matrix.python }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-${{ matrix.python }}-
      - name: Install locked environment
        run: |
          python -m pip install --disable-pip-version-check uv
          uv sync --locked --all-extras
      - name: Tests
        run: uv run pytest --verbose --cov --cov-report=term-missing
      - name: Lint and type check
        if: matrix.python == '3.12'
        run: |
          uv run ruff check src tests scripts
          uv run ruff format --check src tests scripts
          uv run mypy src/ancestryllm
          ./scripts/check_repository_safety.sh

  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan commits for secrets
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          version: 3.95.9
          extra_args: --results=verified,unknown --fail-on-scan-errors
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Cache uv downloads and builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-3.12-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-3.12-
      - name: Install locked environment
        run: |
          python -m pip install --disable-pip-version-check uv
          uv sync --locked --all-extras
      - name: Dependency and static analysis
        run: |
          uv run pip-audit
          uv run --locked --script scripts/run_pinned_semgrep.py src
      - name: Generate CycloneDX SBOM
        run: uv run cyclonedx-py environment --output-file sbom.json .venv/bin/python
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ancestryllm-sbom
          path: sbom.json
          if-no-files-found: error

  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked environment
        run: |
          python -m pip install --disable-pip-version-check uv
          uv sync --locked --all-extras
      - name: Build reproducible release artifacts
        run: uv run python scripts/build_release.py --output-dir dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  install-smoke:
    name: install (${{ matrix.os }}, ${{ matrix.python }})
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist
      - name: Install wheel and smoke-test CLI
        shell: bash
        env:
          ANCESTRYLLM_CONFIG_DIR: ${{ runner.temp }}/ancestryllm/config
          ANCESTRYLLM_DATA_DIR: ${{ runner.temp }}/ancestryllm/data
        run: |
          python -m pip install --disable-pip-version-check dist/*.whl
          ancestry --version
          ancestry --json modules list > modules.json
          python -c 'import json; assert json.load(open("modules.json", encoding="utf-8"))'

  sdist-smoke:
    name: install sdist
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist
      - name: Install source distribution and smoke-test CLI
        env:
          ANCESTRYLLM_CONFIG_DIR: ${{ runner.temp }}/ancestryllm/config
          ANCESTRYLLM_DATA_DIR: ${{ runner.temp }}/ancestryllm/data
        run: |
          python -m pip install --disable-pip-version-check dist/*.tar.gz
          ancestry --version
          ancestry --json modules list > modules.json
          python -c 'import json; assert json.load(open("modules.json", encoding="utf-8"))'

  workflow-audit:
    name: workflow audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Audit workflow security
        run: |
          python -m pip install --disable-pip-version-check uv
          uv sync --locked --all-extras
          uv run zizmor --persona=pedantic .github/workflows
