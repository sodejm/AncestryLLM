name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_version:
        description: Stable SemVer to package without publishing
        required: true
        type: string
      commit_sha:
        description: Exact full commit SHA from origin/main to package
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name }}-${{ inputs.commit_sha || github.sha }}
  cancel-in-progress: false

jobs:
  validate:
    name: validate release request
    runs-on: ubuntu-24.04
    permissions:
      actions: read # required to locate and download release-readiness evidence
      contents: read # required to verify the tag and release commit
      issues: read # required to recheck Project issue dependencies
    outputs:
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
      readiness_run: ${{ steps.release.outputs.readiness_run }}
      desktop_run: ${{ steps.release.outputs.desktop_run }}
      desktop_release_run: ${{ steps.release.outputs.desktop_release_run }}
      desktop_release_artifact: ${{ steps.release.outputs.desktop_release_artifact }}
      desktop_release_digest: ${{ steps.release.outputs.desktop_release_digest }}
      binary_signing_mode: ${{ steps.release.outputs.binary_signing_mode }}
      release_tag_mode: ${{ steps.release.outputs.release_tag_mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: release
        name: Verify exact release identity and permitted boundary
        env:
          GH_TOKEN: ${{ github.token }}
          PROJECT_READ_TOKEN: ${{ secrets.ANCESTRYLLM_PROJECT_READ_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          TAG_COMMIT: ${{ github.sha }}
          REQUESTED_VERSION: ${{ inputs.release_version }}
          REQUESTED_COMMIT: ${{ inputs.commit_sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if test "$EVENT_NAME" = "workflow_dispatch"; then
            version="$REQUESTED_VERSION"
            commit="$REQUESTED_COMMIT"
          else
            version="${TAG_NAME#v}"
            commit="$TAG_COMMIT"
          fi
          python - "$version" <<'PY'
          import ast
          import json
          import re
          import sys
          import tomllib
          from pathlib import Path

          expected = sys.argv[1]
          if not re.fullmatch(r"(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)", expected):
              raise SystemExit("release version is not stable SemVer")

          with Path("pyproject.toml").open("rb") as handle:
              python_version = str(tomllib.load(handle)["project"]["version"])
          desktop_version = str(
              json.loads(Path("desktop/package.json").read_text(encoding="utf-8"))["version"]
          )
          sidecar_module = ast.parse(
              Path("src/ancestryllm/api/sidecar.py").read_text(encoding="utf-8")
          )
          sidecar_builds = [
              node.value.value
              for node in sidecar_module.body
              if isinstance(node, ast.Assign)
              and any(
                  isinstance(target, ast.Name) and target.id == "SIDECAR_BUILD"
                  for target in node.targets
              )
              and isinstance(node.value, ast.Constant)
              and isinstance(node.value.value, str)
          ]
          identities = {
              "pyproject.toml": python_version,
              "desktop/package.json": desktop_version,
              "src/ancestryllm/api/sidecar.py": sidecar_builds[0]
              if len(sidecar_builds) == 1
              else f"invalid assignments: {sidecar_builds!r}",
          }
          mismatches = {
              source: actual for source, actual in identities.items() if actual != expected
          }
          if mismatches:
              raise SystemExit(
                  f"release build identity mismatch for {expected!r}: {mismatches!r}"
              )
          PY
          test "${#commit}" -eq 40
          case "$commit" in *[!0-9a-f]*) echo "commit_sha must be lowercase hexadecimal" >&2; exit 1 ;; esac
          test "$GITHUB_SHA" = "$commit"
          test "$(git rev-parse HEAD)" = "$commit"
          project_owner="$(jq -r '.project.owner' .github/release-config.json)"
          project_number="$(jq -r '.project.number' .github/release-config.json)"
          project_title="$(jq -r '.project.title' .github/release-config.json)"
          project_iteration="$(jq -r '.project.iteration' .github/release-config.json)"
          project_priority="$(jq -r '.project.priority' .github/release-config.json)"
          project_status="$(jq -r '.project.status' .github/release-config.json)"
          project_validation="$(jq -r '.project.validation' .github/release-config.json)"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$commit"
          test "$(jq -r '.release' .github/release-config.json)" = "$version"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          binary_signing_mode="$(python scripts/release_signing_policy.py --version "$version")"
          release_tag_mode="$(python scripts/release_signing_policy.py --version "$version" --tag-mode)"
          echo "binary_signing_mode=$binary_signing_mode" >> "$GITHUB_OUTPUT"
          echo "release_tag_mode=$release_tag_mode" >> "$GITHUB_OUTPUT"

          if test "$EVENT_NAME" = "workflow_dispatch"; then
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "commit=$commit" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python scripts/verify_release_configuration.py \
            --config .github/release-config.json \
            --version "$version"
          project_query='query($owner: String!, $number: Int!, $endCursor: String) { user(login: $owner) { projectV2(number: $number) { number title items(first: 100, after: $endCursor) { nodes { id content { __typename ... on Issue { number state repository { nameWithOwner } blockedBy(first: 100) { nodes { number state repository { nameWithOwner } } dependencyPageInfo: pageInfo { hasNextPage endCursor } } } } fieldValues(first: 100) { nodes { __typename ... on ProjectV2ItemFieldSingleSelectValue { name field { ... on ProjectV2SingleSelectField { name } } } ... on ProjectV2ItemFieldIterationValue { title iterationId field { ... on ProjectV2IterationField { name } } } } } } pageInfo { hasNextPage endCursor } } } } }'
          test -n "$PROJECT_READ_TOKEN" || {
            echo "Missing required Actions secret ANCESTRYLLM_PROJECT_READ_TOKEN for private Project read access." >&2
            exit 1
          }
          GH_TOKEN="$PROJECT_READ_TOKEN" gh api graphql --paginate --slurp \
            -f query="$project_query" \
            -f owner="$project_owner" \
            -F number="$project_number" |
            python scripts/verify_release_project.py \
              --project-owner "$project_owner" \
              --project-number "$project_number" \
              --project-title "$project_title" \
              --iteration "$project_iteration" \
              --priority "$project_priority" \
              --status "$project_status" \
              --validation "$project_validation"
          test "$(git rev-parse "${TAG_NAME}^{commit}")" = "$commit"
          ref_json="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG_NAME")"
          test "$(jq -r '.object.type' <<<"$ref_json")" = "tag"
          tag_object="$(jq -r '.object.sha' <<<"$ref_json")"
          tag_json="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object")"
          case "$release_tag_mode" in
            unsigned-annotated)
              test "$(jq -r '.verification.verified' <<<"$tag_json")" = "false"
              test "$(jq -r '.verification.reason' <<<"$tag_json")" = "unsigned"
              test "$(jq -r '.verification.signature' <<<"$tag_json")" = "null"
              test "$(jq -r '.verification.payload' <<<"$tag_json")" = "null"
              ;;
            signed-annotated)
              test "$(jq -r '.verification.verified' <<<"$tag_json")" = "true"
              ;;
            *)
              echo "unsupported release tag mode: $release_tag_mode" >&2
              exit 1
              ;;
          esac
          test "$(jq -r '.object.sha' <<<"$tag_json")" = "$commit"
          tag_message="$RUNNER_TEMP/desktop-release-tag-message.txt"
          approval_json="$RUNNER_TEMP/desktop-release-approval.json"
          jq -r '.message' <<<"$tag_json" > "$tag_message"
          python - "$tag_message" "$approval_json" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          message_path, output_path = map(Path, sys.argv[1:])
          message = message_path.read_text(encoding="utf-8")
          fields = {
              "runId": r"Desktop-Release-Run-ID: ([1-9]\d*)",
              "artifactId": r"Desktop-Release-Artifact-ID: ([1-9]\d*)",
              "artifactDigest": r"Desktop-Release-Artifact-Digest: (sha256:[0-9a-f]{64})",
          }
          result: dict[str, int | str] = {}
          for name, pattern in fields.items():
              matches = re.findall(rf"(?m)^{pattern}$", message)
              if len(matches) != 1:
                  raise SystemExit(
                      f"annotated release tag must contain exactly one {pattern!r} line"
                  )
              result[name] = matches[0] if name == "artifactDigest" else int(matches[0])
          output_path.write_text(json.dumps(result, sort_keys=True), encoding="utf-8")
          PY
          desktop_release_run="$(jq -r '.runId' "$approval_json")"
          desktop_release_artifact="$(jq -r '.artifactId' "$approval_json")"
          desktop_release_digest="$(jq -r '.artifactDigest' "$approval_json")"
          approved_run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$desktop_release_run")"
          release_workflow_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml" --jq '.id')"
          test "$(jq -r '.workflow_id' <<<"$approved_run")" = "$release_workflow_id"
          test "$(jq -r '.event' <<<"$approved_run")" = "workflow_dispatch"
          test "$(jq -r '.status' <<<"$approved_run")" = "completed"
          test "$(jq -r '.conclusion' <<<"$approved_run")" = "success"
          test "$(jq -r '.head_sha' <<<"$approved_run")" = "$commit"
          approved_artifact="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$desktop_release_artifact")"
          test "$(jq -r '.workflow_run.id' <<<"$approved_artifact")" = "$desktop_release_run"
          test "$(jq -r '.name' <<<"$approved_artifact")" = "desktop-release-distributions-$version-$commit"
          test "$(jq -r '.expired' <<<"$approved_artifact")" = "false"
          test "$(jq -r '.digest' <<<"$approved_artifact")" = "$desktop_release_digest"
          readiness_run="$(
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release-readiness.yml/runs?event=workflow_dispatch&status=success&head_sha=$commit&per_page=10" \
              --jq '.workflow_runs[0].id'
          )"
          test -n "$readiness_run"
          mkdir approved
          gh run download "$readiness_run" --repo "$GITHUB_REPOSITORY" \
            --name release-evidence --dir approved
          grep -F -- "- Version: \`$version\`" approved/release-evidence.md
          grep -F -- "- Commit: \`$commit\`" approved/release-evidence.md
          test "$(jq -r '.release' approved/gates.json)" = "$version"
          test "$(jq -r '.commit' approved/gates.json)" = "$commit"
          test "$(jq -r '[.gates[].status == "verified"] | all' approved/gates.json)" = "true"
          desktop_run="$(
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/desktop-sidecar.yml/runs?event=workflow_dispatch&status=success&head_sha=$commit&per_page=10" \
              --jq '.workflow_runs[0].id'
          )"
          test -n "$desktop_run"
          mkdir approved-desktop
          gh run download "$desktop_run" --repo "$GITHUB_REPOSITORY" \
            --name desktop-evidence-aggregate --dir approved-desktop
          python - "$commit" approved-desktop/desktop-evidence.json <<'PY'
          import json
          import sys

          commit, path = sys.argv[1:]
          with open(path, encoding="utf-8") as handle:
              evidence = json.load(handle)
          assert evidence["schemaVersion"] == 2
          assert evidence["kind"] == "aggregate"
          assert evidence["gitHead"] == commit
          assert evidence["status"] == "passed"
          assert evidence["platformValidated"] is True
          assert evidence["publicationRequirements"] == {"desktopInstaller": True}
          expected = {
              ("macos-15", "darwin-arm64", "macOS 15", "macOS 15", "arm64", "arm64"),
              ("macos-15-intel", "darwin-x64", "macOS 15", "macOS 15", "x64", "x64"),
              ("macos-26", "darwin-arm64", "macOS 26", "macOS 26", "arm64", "arm64"),
              ("macos-26-intel", "darwin-x64", "macOS 26", "macOS 26", "x64", "x64"),
              ("windows-11-arm", "win32-arm64", "Windows 11", "Windows 11", "arm64", "arm64"),
              ("ubuntu-24.04", "linux-x64", "Ubuntu 24.04", "Ubuntu 24.04", "x64", "x64"),
          }
          actual = {
              (
                  row["runner"],
                  row["sidecarTarget"],
                  row["expectedOs"],
                  row["actualOs"],
                  row["arch"],
                  row["hostArch"],
              )
              for row in evidence["targets"]
          }
          assert actual == expected
          assert all(row["platformValidated"] is True for row in evidence["targets"])
          PY
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "readiness_run=$readiness_run" >> "$GITHUB_OUTPUT"
          echo "desktop_run=$desktop_run" >> "$GITHUB_OUTPUT"
          echo "desktop_release_run=$desktop_release_run" >> "$GITHUB_OUTPUT"
          echo "desktop_release_artifact=$desktop_release_artifact" >> "$GITHUB_OUTPUT"
          echo "desktop_release_digest=$desktop_release_digest" >> "$GITHUB_OUTPUT"

  build:
    name: build release once
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      actions: read # required to compare the approved readiness distributions
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Rebuild deterministic artifacts and SBOM
        run: |
          python -m pip install --disable-pip-version-check uv==0.12.1
          uv sync --locked --all-extras
          uv run python scripts/build_release.py --output-dir dist
          uv run cyclonedx-py environment --output-file dist/sbom.json .venv/bin/python
      - name: Compare approved readiness artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          READINESS_RUN: ${{ needs.validate.outputs.readiness_run }}
          VERSION: ${{ needs.validate.outputs.version }}
          BINARY_SIGNING_MODE: ${{ needs.validate.outputs.binary_signing_mode }}
        run: |
          mkdir approved
          gh run download "$READINESS_RUN" --repo "$GITHUB_REPOSITORY" \
            --name release-evidence --dir approved
          cmp dist/SHA256SUMS approved/artifacts/SHA256SUMS
          cmp "docs/release-evidence/$VERSION/findings.json" \
            approved/findings-dispositions.json
          cmp "docs/release-evidence/$VERSION/interoperability.json" \
            approved/interoperability.json
          cp approved/gates.json dist/gates.json
          cp approved/findings-dispositions.json dist/findings-dispositions.json
          cp approved/interoperability.json dist/interoperability.json
          cp approved/release-evidence.md dist/readiness-evidence.md
          cp "docs/release-notes/$VERSION.md" dist/release-notes.md
          printf '\n\n' >> dist/release-notes.md
          python scripts/release_signing_policy.py \
            --version "$VERSION" \
            --mode "$BINARY_SIGNING_MODE" \
            --notice >> dist/release-notes.md
      - name: Create provisional Python evidence manifest
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          COMMIT_SHA: ${{ needs.validate.outputs.commit }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python scripts/create_release_evidence.py \
            --version "$VERSION" \
            --commit "$COMMIT_SHA" \
            --run-url "$RUN_URL" \
            --artifacts dist \
            --gates dist/gates.json \
            --findings dist/findings-dispositions.json \
            --interoperability dist/interoperability.json \
            --output dist/release-evidence.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-release-distributions
          path: dist/
          if-no-files-found: error

  desktop-installers:
    name: desktop installer (${{ matrix.sidecar_target }})
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            runs_on: '"macos-15"'
            sidecar_target: darwin-arm64
            expected_os: "macOS 15"
            arch: arm64
            installer_target: dmg
            package_args: --mac --arm64
          - runner: macos-15-intel
            runs_on: '"macos-15-intel"'
            sidecar_target: darwin-x64
            expected_os: "macOS 15"
            arch: x64
            installer_target: dmg
            package_args: --mac --x64
          - runner: windows-11-arm
            runs_on: '"windows-11-arm"'
            sidecar_target: win32-arm64
            expected_os: "Windows 11"
            arch: arm64
            host_arch: arm64
            installer_target: nsis
            package_args: --win --arm64
          - runner: ubuntu-24.04
            runs_on: '"ubuntu-24.04"'
            sidecar_target: linux-x64
            expected_os: "Ubuntu 24.04"
            arch: x64
            installer_target: deb
            package_args: --linux --x64
    runs-on: ${{ fromJSON(matrix.runs_on) }}
    environment: ${{ needs.validate.outputs.binary_signing_mode == 'trusted' && 'desktop-signing' || 'desktop-prerelease' }}
    permissions:
      contents: read
    env:
      EXPECTED_HEAD: ${{ needs.validate.outputs.commit }}
      VERSION: ${{ needs.validate.outputs.version }}
      BINARY_SIGNING_MODE: ${{ needs.validate.outputs.binary_signing_mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - name: Verify exact installer head
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          architecture: ${{ matrix.arch }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "26.5.0"
          architecture: ${{ matrix.arch }}
          package-manager-cache: false
      - name: Verify native ARM64 runtimes on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $nodeArch = node -p "process.arch"
          if ($nodeArch -ne 'arm64') { throw "expected arm64 Node.js runtime, found $nodeArch" }
          $pythonPlatform = python -c "import sysconfig; print(sysconfig.get_platform())"
          if ($pythonPlatform -ne 'win-arm64') { throw "expected win-arm64 Python runtime, found $pythonPlatform" }
      - uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        with:
          version: "11.9.0"
      - name: Install wheel-only locked Python desktop build dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check uv==0.12.1
          uv sync --locked --extra desktop-build --no-install-project --no-build
          uv pip install --python .venv --no-deps --editable .
      - name: Install locked desktop release dependencies
        shell: bash
        run: |
          pnpm --dir desktop install --frozen-lockfile
      - name: Build and smoke-test the native sidecar
        shell: bash
        env:
          SIDECAR_TARGET: ${{ matrix.sidecar_target }}
        run: |
          uv run --no-sync python scripts/build_sidecar.py --expected-target "$SIDECAR_TARGET"
          sidecar_executable="desktop/build/sidecar/$SIDECAR_TARGET/ancestryllm-sidecar/ancestryllm-sidecar"
          if [[ "$SIDECAR_TARGET" == win32-* ]]; then sidecar_executable="$sidecar_executable.exe"; fi
          uv run --no-sync python scripts/smoke_sidecar.py "$sidecar_executable"
      - name: Build the production Electron application
        shell: bash
        run: pnpm --dir desktop run build
      - name: Build macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          PACKAGE_ARGS: ${{ matrix.package_args }}
        run: |
          signing_args=()
          if [[ "$BINARY_SIGNING_MODE" == "trusted" ]]; then
            test -n "$APPLE_CERTIFICATE_BASE64"
            test -n "$APPLE_CERTIFICATE_PASSWORD"
            test -n "$APPLE_API_KEY_BASE64"
            test -n "$APPLE_API_KEY_ID"
            test -n "$APPLE_API_ISSUER"
            signing_dir="$RUNNER_TEMP/ancestryllm-desktop-signing"
            install -d -m 700 "$signing_dir"
            printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 -D > "$signing_dir/certificate.p12"
            printf '%s' "$APPLE_API_KEY_BASE64" | base64 -D > "$signing_dir/AuthKey_$APPLE_API_KEY_ID.p8"
            chmod 600 "$signing_dir"/*
            export CSC_LINK="$signing_dir/certificate.p12"
            export CSC_KEY_PASSWORD="$APPLE_CERTIFICATE_PASSWORD"
            export APPLE_API_KEY="$signing_dir/AuthKey_$APPLE_API_KEY_ID.p8"
            signing_args+=(
              --config.mac.forceCodeSigning=true
              --config.mac.hardenedRuntime=true
              --config.mac.notarize=true
            )
          else
            test -z "$APPLE_CERTIFICATE_BASE64"
            test -z "$APPLE_CERTIFICATE_PASSWORD"
            test -z "$APPLE_API_KEY_BASE64"
            test -z "$APPLE_API_KEY_ID"
            test -z "$APPLE_API_ISSUER"
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER
            signing_args+=(
              --config.mac.identity=null
              --config.mac.forceCodeSigning=false
              --config.mac.hardenedRuntime=false
              --config.mac.notarize=false
            )
          fi
          read -r -a package_args <<< "$PACKAGE_ARGS"
          pnpm --dir desktop exec electron-builder \
            --config electron-builder.release.yml \
            "${package_args[@]}" --publish never \
            "${signing_args[@]}" \
            --config.extraMetadata.version="$VERSION"
      - name: Remove temporary macOS signing credentials
        if: always() && runner.os == 'macOS'
        shell: bash
        run: rm -rf "$RUNNER_TEMP/ancestryllm-desktop-signing"
      - name: Build Windows NSIS installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          PACKAGE_ARGS: ${{ matrix.package_args }}
        run: |
          $signingArgs = @()
          if ($env:BINARY_SIGNING_MODE -eq 'trusted') {
            if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64)) { throw 'WINDOWS_CERTIFICATE_BASE64 is required' }
            if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) { throw 'WINDOWS_CERTIFICATE_PASSWORD is required' }
            $signingDirectory = Join-Path $env:RUNNER_TEMP 'ancestryllm-desktop-signing'
            New-Item -ItemType Directory -Force -Path $signingDirectory | Out-Null
            $certificate = Join-Path $signingDirectory 'certificate.pfx'
            [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
            $env:CSC_LINK = $certificate
            $env:CSC_KEY_PASSWORD = $env:WINDOWS_CERTIFICATE_PASSWORD
            $signingArgs = @(
              '--config.win.forceCodeSigning=true',
              '--config.win.signAndEditExecutable=true',
              '--config.win.signExecutable=true'
            )
          } else {
            if (-not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64)) { throw 'WINDOWS_CERTIFICATE_BASE64 must be empty for an unsigned release' }
            if (-not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) { throw 'WINDOWS_CERTIFICATE_PASSWORD must be empty for an unsigned release' }
            $env:CSC_IDENTITY_AUTO_DISCOVERY = 'false'
            Remove-Item Env:CSC_LINK -ErrorAction SilentlyContinue
            Remove-Item Env:CSC_KEY_PASSWORD -ErrorAction SilentlyContinue
            $signingArgs = @(
              '--config.win.forceCodeSigning=false',
              '--config.win.signAndEditExecutable=true',
              '--config.win.signExecutable=false'
            )
          }
          $packageArgs = $env:PACKAGE_ARGS.Split(' ', [StringSplitOptions]::RemoveEmptyEntries)
          pnpm --dir desktop exec electron-builder --config electron-builder.release.yml @packageArgs --publish never @signingArgs "--config.extraMetadata.version=$env:VERSION"
          if ($LASTEXITCODE -ne 0) { throw "electron-builder exited $LASTEXITCODE" }
      - name: Remove temporary Windows signing credentials
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'ancestryllm-desktop-signing') -Recurse -Force -ErrorAction SilentlyContinue
      - name: Build Ubuntu DEB
        if: runner.os == 'Linux'
        shell: bash
        env:
          PACKAGE_ARGS: ${{ matrix.package_args }}
        run: |
          read -r -a package_args <<< "$PACKAGE_ARGS"
          pnpm --dir desktop exec electron-builder \
            --config electron-builder.release.yml \
            "${package_args[@]}" --publish never \
            --config.extraMetadata.version="$VERSION"
      - id: installer
        name: Locate the one bounded installer
        shell: bash
        env:
          INSTALLER_TARGET: ${{ matrix.installer_target }}
        run: |
          shopt -s nullglob
          case "$INSTALLER_TARGET" in
            dmg) installers=(desktop/release-installers/*.dmg) ;;
            nsis) installers=(desktop/release-installers/*.exe) ;;
            deb) installers=(desktop/release-installers/*.deb) ;;
            *) echo "unsupported installer target: $INSTALLER_TARGET" >&2; exit 1 ;;
          esac
          test "${#installers[@]}" -eq 1
          echo "path=${installers[0]}" >> "$GITHUB_OUTPUT"
      - name: Verify bundled sidecar resource
        shell: bash
        env:
          SIDECAR_TARGET: ${{ matrix.sidecar_target }}
        run: node desktop/scripts/verify-sidecar.mjs "$SIDECAR_TARGET" desktop/release-installers
      - name: Verify and install macOS application
        if: runner.os == 'macOS'
        shell: bash
        env:
          INSTALLER: ${{ steps.installer.outputs.path }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          ANCESTRYLLM_PACKAGED_RUNTIME_PATH: ""
          ANCESTRYLLM_PACKAGED_METRICS: ${{ runner.temp }}/ancestryllm-packaged-metrics.json
        run: |
          if [[ "$BINARY_SIGNING_MODE" == "trusted" ]]; then
            case "$APPLE_TEAM_ID" in
              ??????????) ;;
              *)
                echo "APPLE_TEAM_ID must be exactly 10 uppercase letters or digits" >&2
                exit 1
                ;;
            esac
            case "$APPLE_TEAM_ID" in
              *[!A-Z0-9]*)
                echo "APPLE_TEAM_ID must be exactly 10 uppercase letters or digits" >&2
                exit 1
                ;;
            esac
          fi
          mount_point="$RUNNER_TEMP/ancestryllm-dmg"
          installed_app="$RUNNER_TEMP/AncestryLLM.app"
          mkdir "$mount_point"
          hdiutil attach "$INSTALLER" -nobrowse -readonly -mountpoint "$mount_point"
          mounted_apps=("$mount_point"/*.app)
          test "${#mounted_apps[@]}" -eq 1
          if [[ "$BINARY_SIGNING_MODE" == "trusted" ]]; then
            codesign --verify --strict --verbose=4 "$INSTALLER"
            codesign --verify --deep --strict --verbose=4 "${mounted_apps[0]}"
            codesign -d --verbose=4 "${mounted_apps[0]}" 2> "$RUNNER_TEMP/codesign-details.txt"
            grep -Fxq "TeamIdentifier=$APPLE_TEAM_ID" "$RUNNER_TEMP/codesign-details.txt"
            grep -E 'flags=.*runtime' "$RUNNER_TEMP/codesign-details.txt"
            spctl --assess --type execute --verbose=4 "${mounted_apps[0]}"
            xcrun stapler validate "$INSTALLER"
          else
            if codesign --verify --strict "$INSTALLER"; then
              echo "0.x macOS installer must be unsigned" >&2
              exit 1
            fi
            if codesign --verify --deep --strict "${mounted_apps[0]}"; then
              echo "0.x macOS application must be unsigned" >&2
              exit 1
            fi
          fi
          ditto --noqtn "${mounted_apps[0]}" "$installed_app"
          export ANCESTRYLLM_PACKAGED_APP="$installed_app/Contents/MacOS/ancestryllm"
          pnpm --dir desktop run test:e2e:packaged \
            --grep "exercises first run, persistence, corrupt preferences, security, and resource evidence"
      - name: Unmount macOS installer
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          if mount | grep -Fq "$RUNNER_TEMP/ancestryllm-dmg"; then
            hdiutil detach "$RUNNER_TEMP/ancestryllm-dmg"
          fi
      - name: Verify, install, and exercise Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          INSTALLER: ${{ steps.installer.outputs.path }}
          EXPECTED_HOST_ARCH: ${{ matrix.host_arch || matrix.arch }}
          WINDOWS_SIGNING_CERTIFICATE_THUMBPRINT: ${{ vars.WINDOWS_SIGNING_CERTIFICATE_THUMBPRINT }}
          ANCESTRYLLM_PACKAGED_RUNTIME_PATH: ""
          ANCESTRYLLM_PACKAGED_METRICS: ${{ runner.temp }}/ancestryllm-packaged-metrics.json
        run: |
          $installer = (Resolve-Path -LiteralPath $env:INSTALLER).Path
          $hostArch = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
          if ($hostArch -ne $env:EXPECTED_HOST_ARCH) {
            throw "expected host architecture $env:EXPECTED_HOST_ARCH, found $hostArch"
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          if ($env:BINARY_SIGNING_MODE -eq 'trusted') {
            $expectedThumbprint = ($env:WINDOWS_SIGNING_CERTIFICATE_THUMBPRINT -replace '\s', '').ToUpperInvariant()
            if ($expectedThumbprint -notmatch '^[0-9A-F]{40}$') { throw 'WINDOWS_SIGNING_CERTIFICATE_THUMBPRINT must be a complete 40-character SHA-1 certificate thumbprint' }
            if ($signature.Status -ne 'Valid') { throw "installer Authenticode status is $($signature.Status)" }
            if ($signature.SignerCertificate.Thumbprint.ToUpperInvariant() -ne $expectedThumbprint) { throw 'installer signer certificate thumbprint does not match the approved identity' }
          } elseif ($signature.Status -ne 'NotSigned') {
            throw "unsigned installer Authenticode status is $($signature.Status)"
          }
          $statePath = Join-Path $env:RUNNER_TEMP 'ancestryllm-install-root.txt'
          Remove-Item -LiteralPath $statePath -Force -ErrorAction SilentlyContinue
          $process = Start-Process -FilePath $installer -ArgumentList @('/S', '/currentuser') -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "NSIS installer exited $($process.ExitCode)" }
          $displayName = "AncestryLLM $env:VERSION"
          $registrations = @(
            Get-ChildItem -LiteralPath 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall' |
              ForEach-Object {
                $registration = Get-ItemProperty -LiteralPath $_.PSPath
                if (
                  $registration.DisplayName -eq $displayName -and
                  $registration.DisplayVersion -eq $env:VERSION
                ) {
                  $registration
                }
              }
          )
          if ($registrations.Count -ne 1) {
            throw "expected one $displayName uninstall registration, found $($registrations.Count)"
          }
          $uninstallCommand = [string]$registrations[0].QuietUninstallString
          if ([string]::IsNullOrWhiteSpace($uninstallCommand)) { throw 'installed application registration has no QuietUninstallString' }
          if ($uninstallCommand -notmatch '^"(?<path>[^"]+)"(?:\s|$)') {
            throw "unexpected quiet uninstall command $uninstallCommand"
          }
          $uninstaller = $Matches.path
          if ((Split-Path -Leaf $uninstaller) -ine 'Uninstall AncestryLLM.exe') { throw "unexpected registered uninstaller $uninstaller" }
          if (-not (Test-Path -LiteralPath $uninstaller -PathType Leaf)) { throw "registered uninstaller is absent: $uninstaller" }
          $localAppData = [IO.Path]::GetFullPath([Environment]::GetFolderPath('LocalApplicationData')).TrimEnd('\')
          $installRoot = [IO.Path]::GetFullPath((Split-Path -Parent $uninstaller)).TrimEnd('\')
          if (-not $installRoot.StartsWith("$localAppData\", [StringComparison]::OrdinalIgnoreCase)) {
            throw "unexpected install root outside LocalApplicationData: $installRoot"
          }
          $resourceMarkers = @(
            Get-ChildItem -LiteralPath $installRoot -Filter 'app.asar' -File -Recurse |
              Where-Object { $_.Directory.Name -ieq 'resources' }
          )
          if ($resourceMarkers.Count -ne 1) {
            throw "expected one installed Electron resources marker beneath $installRoot, found $($resourceMarkers.Count)"
          }
          $resourcesPath = $resourceMarkers[0].Directory.FullName
          $application = Join-Path (Split-Path -Parent $resourcesPath) 'ancestryllm.exe'
          if (-not (Test-Path -LiteralPath $application -PathType Leaf)) { throw "installed application is absent: $application" }
          Set-Content -LiteralPath $statePath -Value $installRoot -NoNewline
          $applicationSignature = Get-AuthenticodeSignature -LiteralPath $application
          if ($env:BINARY_SIGNING_MODE -eq 'trusted') {
            if ($applicationSignature.Status -ne 'Valid') { throw "application Authenticode status is $($applicationSignature.Status)" }
            if ($applicationSignature.SignerCertificate.Thumbprint.ToUpperInvariant() -ne $expectedThumbprint) { throw 'application signer certificate thumbprint does not match the approved identity' }
          } elseif ($applicationSignature.Status -ne 'NotSigned') {
            throw "unsigned application Authenticode status is $($applicationSignature.Status)"
          }
          $env:ANCESTRYLLM_PACKAGED_APP = $application
          pnpm --dir desktop run test:e2e:packaged --grep "exercises first run, persistence, corrupt preferences, security, and resource evidence"
          if ($LASTEXITCODE -ne 0) { throw "packaged Electron test exited $LASTEXITCODE" }
      - name: Remove temporary Windows installation
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $statePath = Join-Path $env:RUNNER_TEMP 'ancestryllm-install-root.txt'
          $installRoots = @()
          if (Test-Path -LiteralPath $statePath -PathType Leaf) {
            $installRoot = (Get-Content -LiteralPath $statePath -Raw).Trim()
            if ([string]::IsNullOrWhiteSpace($installRoot)) { throw 'recorded Windows install root is empty' }
            $installRoots += $installRoot
          }
          if ($installRoots.Count -eq 0) {
            $displayName = "AncestryLLM $env:VERSION"
            Get-ChildItem -LiteralPath 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall' -ErrorAction SilentlyContinue |
              ForEach-Object {
                $registration = Get-ItemProperty -LiteralPath $_.PSPath
                if (
                  $registration.DisplayName -eq $displayName -and
                  $registration.DisplayVersion -eq $env:VERSION
                ) {
                  $uninstallCommand = [string]$registration.QuietUninstallString
                  if ([string]::IsNullOrWhiteSpace($uninstallCommand)) { throw 'installed application registration has no QuietUninstallString' }
                  if ($uninstallCommand -notmatch '^"(?<path>[^"]+)"(?:\s|$)') {
                    throw "unexpected quiet uninstall command $uninstallCommand"
                  }
                  $uninstaller = $Matches.path
                  if ((Split-Path -Leaf $uninstaller) -ine 'Uninstall AncestryLLM.exe') { throw "unexpected registered uninstaller $uninstaller" }
                  $installRoots += (Split-Path -Parent $uninstaller)
                }
              }
          }
          $installRoots = @($installRoots | Select-Object -Unique)
          $localAppData = [IO.Path]::GetFullPath([Environment]::GetFolderPath('LocalApplicationData')).TrimEnd('\')
          foreach ($installRoot in $installRoots) {
            $installRoot = [IO.Path]::GetFullPath($installRoot).TrimEnd('\')
            if (-not $installRoot.StartsWith("$localAppData\", [StringComparison]::OrdinalIgnoreCase)) {
              throw "refusing cleanup outside LocalApplicationData: $installRoot"
            }
            $uninstaller = Join-Path $installRoot 'Uninstall AncestryLLM.exe'
            if (Test-Path -LiteralPath $uninstaller -PathType Leaf) {
              $process = Start-Process -FilePath $uninstaller -ArgumentList @('/S', '/currentuser') -Wait -PassThru
              if ($process.ExitCode -ne 0) { throw "NSIS uninstaller exited $($process.ExitCode)" }
            }
            Remove-Item -LiteralPath $installRoot -Recurse -Force -ErrorAction SilentlyContinue
          }
          Remove-Item -LiteralPath $statePath -Force -ErrorAction SilentlyContinue
      - name: Sign Ubuntu installer
        if: runner.os == 'Linux' && env.BINARY_SIGNING_MODE == 'trusted'
        shell: bash
        env:
          INSTALLER: ${{ steps.installer.outputs.path }}
          LINUX_GPG_PRIVATE_KEY_BASE64: ${{ secrets.LINUX_GPG_PRIVATE_KEY_BASE64 }}
          LINUX_GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
          LINUX_GPG_SIGNING_FINGERPRINT: ${{ vars.LINUX_GPG_SIGNING_FINGERPRINT }}
        run: |
          test -n "$LINUX_GPG_PRIVATE_KEY_BASE64"
          test -n "$LINUX_GPG_PASSPHRASE"
          test -n "$LINUX_GPG_SIGNING_FINGERPRINT"
          expected_fingerprint="$(printf '%s' "$LINUX_GPG_SIGNING_FINGERPRINT" | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')"
          case "$expected_fingerprint" in
            *[!0-9A-F]*) echo "Linux signing fingerprint must contain only hexadecimal characters" >&2; exit 1 ;;
          esac
          case "${#expected_fingerprint}" in
            40|64) ;;
            *) echo "Linux signing fingerprint must be a complete 40- or 64-character fingerprint" >&2; exit 1 ;;
          esac
          signing_home="$RUNNER_TEMP/ancestryllm-signing-gnupg"
          private_key="$RUNNER_TEMP/ancestryllm-release-key.asc"
          public_key="$RUNNER_TEMP/ancestryllm-release-public-key.asc"
          cleanup_signing_material() {
            unset LINUX_GPG_PRIVATE_KEY_BASE64 LINUX_GPG_PASSPHRASE
            gpgconf --homedir "$signing_home" --kill all 2>/dev/null || true
            rm -rf "$signing_home"
            rm -f "$private_key"
          }
          trap cleanup_signing_material EXIT
          install -d -m 700 "$signing_home"
          umask 077
          printf '%s' "$LINUX_GPG_PRIVATE_KEY_BASE64" | base64 --decode > "$private_key"
          GNUPGHOME="$signing_home" gpg --batch --import "$private_key"
          GNUPGHOME="$signing_home" gpg --batch --with-colons --fingerprint --list-secret-keys | \
            awk -F: '$1 == "fpr" { print toupper($10) }' | grep -Fxq "$expected_fingerprint"
          GNUPGHOME="$signing_home" gpg --batch --armor --export "$expected_fingerprint" \
            > "$public_key"
          test -s "$public_key"
          printf '%s' "$LINUX_GPG_PASSPHRASE" | GNUPGHOME="$signing_home" \
            gpg --detach-sign --armor --batch --yes --pinentry-mode loopback \
              --passphrase-fd 0 --local-user "$expected_fingerprint!" "$INSTALLER"
          unset LINUX_GPG_PRIVATE_KEY_BASE64 LINUX_GPG_PASSPHRASE
      - name: Verify, install, and exercise Ubuntu application
        if: runner.os == 'Linux'
        shell: bash
        env:
          INSTALLER: ${{ steps.installer.outputs.path }}
          LINUX_GPG_SIGNING_FINGERPRINT: ${{ vars.LINUX_GPG_SIGNING_FINGERPRINT }}
          ANCESTRYLLM_PACKAGED_RUNTIME_PATH: ""
          ANCESTRYLLM_PACKAGED_METRICS: ${{ runner.temp }}/ancestryllm-packaged-metrics.json
        run: |
          if [[ "$BINARY_SIGNING_MODE" == "trusted" ]]; then
            test -n "$LINUX_GPG_SIGNING_FINGERPRINT"
            expected_fingerprint="$(printf '%s' "$LINUX_GPG_SIGNING_FINGERPRINT" | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')"
            case "$expected_fingerprint" in
              *[!0-9A-F]*) echo "Linux signing fingerprint must contain only hexadecimal characters" >&2; exit 1 ;;
            esac
            case "${#expected_fingerprint}" in
              40|64) ;;
              *) echo "Linux signing fingerprint must be a complete 40- or 64-character fingerprint" >&2; exit 1 ;;
            esac
            verification_home="$RUNNER_TEMP/ancestryllm-verification-gnupg"
            public_key="$RUNNER_TEMP/ancestryllm-release-public-key.asc"
            gpg_status="$RUNNER_TEMP/ancestryllm-gpg-status.txt"
            cleanup_verification_material() {
              gpgconf --homedir "$verification_home" --kill all 2>/dev/null || true
              rm -rf "$verification_home"
              rm -f "$public_key" "$gpg_status"
            }
            trap cleanup_verification_material EXIT
            install -d -m 700 "$verification_home"
            test -s "$public_key"
            GNUPGHOME="$verification_home" gpg --batch --import "$public_key"
            if GNUPGHOME="$verification_home" gpg --batch --with-colons --list-secret-keys | grep -q '^sec:'; then
              echo "verification keyring unexpectedly contains a private key" >&2
              exit 1
            fi
            GNUPGHOME="$verification_home" gpg --batch --status-fd 1 --verify \
              "$INSTALLER.asc" "$INSTALLER" | tee "$gpg_status"
            grep -Fq "[GNUPG:] VALIDSIG $expected_fingerprint " \
              "$gpg_status"
            cleanup_verification_material
            trap - EXIT
          else
            test ! -e "$INSTALLER.asc"
          fi
          sudo apt-get install -y "./$INSTALLER"
          dpkg-query --show ancestryllm-desktop
          test -x /opt/AncestryLLM/ancestryllm
          export ANCESTRYLLM_PACKAGED_APP=/opt/AncestryLLM/ancestryllm
          xvfb-run --auto-servernum pnpm --dir desktop run test:e2e:packaged \
            --grep "exercises first run, persistence, corrupt preferences, security, and resource evidence"
      - name: Remove temporary Ubuntu signing and installation state
        if: always() && runner.os == 'Linux'
        shell: bash
        run: |
          sudo dpkg -r ancestryllm-desktop 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/ancestryllm-signing-gnupg" \
            "$RUNNER_TEMP/ancestryllm-verification-gnupg"
          rm -f "$RUNNER_TEMP/ancestryllm-release-key.asc" \
            "$RUNNER_TEMP/ancestryllm-release-public-key.asc" \
            "$RUNNER_TEMP/ancestryllm-gpg-status.txt"
      - name: Generate target SBOM and exact-head evidence
        shell: bash
        env:
          INSTALLER: ${{ steps.installer.outputs.path }}
          SIDECAR_TARGET: ${{ matrix.sidecar_target }}
          EXPECTED_OS: ${{ matrix.expected_os }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          pnpm --dir desktop pkg set version="$VERSION"
          pnpm --dir desktop run sbom
          row_dir="desktop-release-row"
          mkdir "$row_dir"
          installer_name="$(basename "$INSTALLER")"
          cp "$INSTALLER" "$row_dir/$installer_name"
          sbom="$row_dir/desktop-sbom-$SIDECAR_TARGET.json"
          cp desktop/sbom.cdx.json "$sbom"
          signature_args=()
          gates=(
            exactHeadPassed
            installerBuiltPassed
            installedRuntimePassed
            runtimeIsolationPassed
            sbomGeneratedPassed
            sidecarHandshakePassed
          )
          if [[ "$BINARY_SIGNING_MODE" == "trusted" ]]; then
            case "$SIDECAR_TARGET" in
              darwin-*)
                gates+=(codeSignaturePassed gatekeeperPassed hardenedRuntimePassed notarizationPassed staplingPassed)
                ;;
              win32-arm64)
                gates+=(authenticodePassed)
                ;;
              linux-x64)
                cp "$INSTALLER.asc" "$row_dir/$installer_name.asc"
                signature_args=(--signature "$row_dir/$installer_name.asc")
                gates+=(gpgSignaturePassed)
                ;;
              *) echo "unsupported release target: $SIDECAR_TARGET" >&2; exit 1 ;;
            esac
          else
            gates+=(unsignedArtifactPassed)
          fi
          gate_args=()
          for gate in "${gates[@]}"; do gate_args+=(--gate "$gate"); done
          uv run --no-sync python scripts/assemble_desktop_release.py target \
            --git-head "$EXPECTED_HEAD" \
            --version "$VERSION" \
            --signing-mode "$BINARY_SIGNING_MODE" \
            --target "$SIDECAR_TARGET" \
            --expected-os "$EXPECTED_OS" \
            --arch "$TARGET_ARCH" \
            --installer "$row_dir/$installer_name" \
            "${signature_args[@]}" \
            --sbom "$sbom" \
            "${gate_args[@]}" \
            --output "$row_dir/desktop-target-evidence.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-installer-${{ matrix.sidecar_target }}
          path: desktop-release-row/
          if-no-files-found: error

  desktop-installer-validation:
    name: validate desktop installer (${{ matrix.runner }})
    if: github.event_name == 'workflow_dispatch'
    needs: [validate, desktop-installers]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            runs_on: '"macos-15"'
            sidecar_target: darwin-arm64
            expected_os: "macOS 15"
            arch: arm64
            runtime_arch: arm64
            installer_target: dmg
          - runner: macos-15-intel
            runs_on: '"macos-15-intel"'
            sidecar_target: darwin-x64
            expected_os: "macOS 15"
            arch: x64
            runtime_arch: x64
            installer_target: dmg
          - runner: macos-26
            runs_on: '"macos-26"'
            sidecar_target: darwin-arm64
            expected_os: "macOS 26"
            arch: arm64
            runtime_arch: arm64
            installer_target: dmg
          - runner: macos-26-intel
            runs_on: '"macos-26-intel"'
            sidecar_target: darwin-x64
            expected_os: "macOS 26"
            arch: x64
            runtime_arch: x64
            installer_target: dmg
          - runner: windows-11-arm
            runs_on: '"windows-11-arm"'
            sidecar_target: win32-arm64
            expected_os: "Windows 11"
            arch: arm64
            host_arch: arm64
            runtime_arch: arm64
            installer_target: nsis
          - runner: ubuntu-24.04
            runs_on: '"ubuntu-24.04"'
            sidecar_target: linux-x64
            expected_os: "Ubuntu 24.04"
            arch: x64
            runtime_arch: x64
            installer_target: deb
    runs-on: ${{ fromJSON(matrix.runs_on) }}
    permissions:
      actions: read # required to download the exact installer artifact from this run
      contents: read # required to verify and exercise the exact release commit
    env:
      EXPECTED_HEAD: ${{ needs.validate.outputs.commit }}
      VERSION: ${{ needs.validate.outputs.version }}
      BINARY_SIGNING_MODE: ${{ needs.validate.outputs.binary_signing_mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - name: Verify exact validation head
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          architecture: ${{ matrix.runtime_arch }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "26.5.0"
          architecture: ${{ matrix.runtime_arch }}
          package-manager-cache: false
      - name: Verify native ARM64 runtimes on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $nodeArch = node -p "process.arch"
          if ($nodeArch -ne 'arm64') { throw "expected arm64 Node.js runtime, found $nodeArch" }
          $pythonPlatform = python -c "import sysconfig; print(sysconfig.get_platform())"
          if ($pythonPlatform -ne 'win-arm64') { throw "expected win-arm64 Python runtime, found $pythonPlatform" }
      - uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        with:
          version: "11.9.0"
      - name: Install locked desktop test dependencies
        shell: bash
        run: pnpm --dir desktop install --frozen-lockfile
      - id: source
        name: Download and verify the exact installer artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: desktop-installer-${{ matrix.sidecar_target }}
        run: |
          metadata="$RUNNER_TEMP/desktop-installer-artifacts.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$ARTIFACT_NAME&per_page=100" \
            > "$metadata"
          test "$(jq --arg name "$ARTIFACT_NAME" '[.artifacts[] | select(.name == $name and .expired == false)] | length' "$metadata")" -eq 1
          artifact_id="$(jq -r --arg name "$ARTIFACT_NAME" '.artifacts[] | select(.name == $name and .expired == false) | .id' "$metadata")"
          artifact_digest="$(jq -r --arg name "$ARTIFACT_NAME" '.artifacts[] | select(.name == $name and .expired == false) | .digest' "$metadata")"
          python - "$artifact_id" "$artifact_digest" <<'PY'
          import re
          import sys

          artifact_id, digest = sys.argv[1:]
          assert re.fullmatch(r"[1-9]\d*", artifact_id)
          assert re.fullmatch(r"sha256:[0-9a-f]{64}", digest)
          PY
          archive="$RUNNER_TEMP/desktop-installer-source.zip"
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" \
            --output "$archive"
          python - "$archive" "$artifact_digest" <<'PY'
          import hashlib
          import sys
          from pathlib import Path

          archive, expected = sys.argv[1:]
          actual = "sha256:" + hashlib.sha256(Path(archive).read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit(f"artifact archive digest {actual} != {expected}")
          PY
          mkdir desktop-installer-source
          python - "$archive" desktop-installer-source <<'PY'
          import stat
          import sys
          import zipfile
          from pathlib import Path, PurePosixPath

          archive, destination = Path(sys.argv[1]), Path(sys.argv[2])
          with zipfile.ZipFile(archive) as bundle:
              names: set[str] = set()
              for member in bundle.infolist():
                  name = member.filename
                  path = PurePosixPath(name)
                  mode = member.external_attr >> 16
                  if (
                      not name
                      or "\\" in name
                      or path.is_absolute()
                      or ".." in path.parts
                      or name in names
                      or stat.S_ISLNK(mode)
                  ):
                      raise SystemExit(f"unsafe artifact archive member: {name!r}")
                  names.add(name)
              bundle.extractall(destination)
          PY
          echo "artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"
          echo "artifact_digest=$artifact_digest" >> "$GITHUB_OUTPUT"
      - id: installer
        name: Locate the one previously built installer
        shell: bash
        env:
          INSTALLER_TARGET: ${{ matrix.installer_target }}
        run: |
          python - "$INSTALLER_TARGET" "$GITHUB_OUTPUT" <<'PY'
          import sys
          from pathlib import Path

          target, output_file = sys.argv[1:]
          extensions = {"dmg": "dmg", "nsis": "exe", "deb": "deb"}
          try:
              extension = extensions[target]
          except KeyError as error:
              raise SystemExit(f"unsupported installer target: {target}") from error

          installers = sorted(
              path
              for path in Path("desktop-installer-source").rglob(f"*.{extension}")
              if path.is_file()
          )
          if len(installers) != 1:
              names = ", ".join(str(path) for path in installers) or "none"
              raise SystemExit(
                  f"expected exactly one .{extension} installer, found "
                  f"{len(installers)}: {names}"
              )
          installer = str(installers[0])
          if "\n" in installer or "\r" in installer:
              raise SystemExit("installer path contains a line break")
          with Path(output_file).open("a", encoding="utf-8") as output:
              output.write(f"path={installer}\n")
          PY
      - id: macos-host
        name: Verify supported macOS version
        if: runner.os == 'macOS'
        shell: bash
        env:
          EXPECTED_OS: ${{ matrix.expected_os }}
        run: |
          actual_os="macOS $(sw_vers -productVersion | cut -d. -f1)"
          test "$actual_os" = "$EXPECTED_OS"
          echo "actual_os=$actual_os" >> "$GITHUB_OUTPUT"
      - id: windows-host
        name: Verify exact Windows 11 host
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          EXPECTED_OS: ${{ matrix.expected_os }}
          EXPECTED_HOST_ARCH: ${{ matrix.host_arch || matrix.arch }}
        run: |
          $caption = (Get-CimInstance Win32_OperatingSystem).Caption
          if ($caption -notmatch 'Windows 11') { throw "expected Windows 11, found $caption" }
          $hostArch = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
          if ($hostArch -ne $env:EXPECTED_HOST_ARCH) {
            throw "expected host architecture $env:EXPECTED_HOST_ARCH, found $hostArch"
          }
          $actualOs = 'Windows 11'
          if ($actualOs -ne $env:EXPECTED_OS) {
            throw "expected $env:EXPECTED_OS, found $caption"
          }
          "actual_os=$actualOs" >> $env:GITHUB_OUTPUT
      - id: linux-host
        name: Verify exact Ubuntu 24.04 host
        if: runner.os == 'Linux'
        shell: bash
        env:
          EXPECTED_OS: ${{ matrix.expected_os }}
        run: |
          source /etc/os-release
          test "$ID" = ubuntu
          actual_os="Ubuntu $VERSION_ID"
          test "$actual_os" = "$EXPECTED_OS"
          echo "actual_os=$actual_os" >> "$GITHUB_OUTPUT"
      - name: Verify and exercise macOS application
        if: runner.os == 'macOS'
        shell: bash
        env:
          INSTALLER: ${{ steps.installer.outputs.path }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          ANCESTRYLLM_PACKAGED_RUNTIME_PATH: ""
          ANCESTRYLLM_PACKAGED_METRICS: ${{ runner.temp }}/ancestryllm-packaged-metrics.json
        run: |
          if [[ "$BINARY_SIGNING_MODE" == "trusted" ]]; then
            case "$APPLE_TEAM_ID" in
              ??????????) ;;
              *)
                echo "APPLE_TEAM_ID must be exactly 10 uppercase letters or digits" >&2
                exit 1
                ;;
            esac
            case "$APPLE_TEAM_ID" in
              *[!A-Z0-9]*)
                echo "APPLE_TEAM_ID must be exactly 10 uppercase letters or digits" >&2
                exit 1
                ;;
            esac
          fi
          mount_point="$RUNNER_TEMP/ancestryllm-validation-dmg"
          installed_app="$RUNNER_TEMP/AncestryLLM.app"
          mkdir "$mount_point"
          hdiutil attach "$INSTALLER" -nobrowse -readonly -mountpoint "$mount_point"
          mounted_apps=("$mount_point"/*.app)
          test "${#mounted_apps[@]}" -eq 1
          if [[ "$BINARY_SIGNING_MODE" == "trusted" ]]; then
            codesign --verify --strict --verbose=4 "$INSTALLER"
            codesign --verify --deep --strict --verbose=4 "${mounted_apps[0]}"
            codesign -d --verbose=4 "${mounted_apps[0]}" 2> "$RUNNER_TEMP/codesign-validation-details.txt"
            grep -Fxq "TeamIdentifier=$APPLE_TEAM_ID" "$RUNNER_TEMP/codesign-validation-details.txt"
            spctl --assess --type execute --verbose=4 "${mounted_apps[0]}"
            xcrun stapler validate "$INSTALLER"
          else
            if codesign --verify --strict "$INSTALLER"; then
              echo "0.x macOS installer must be unsigned" >&2
              exit 1
            fi
            if codesign --verify --deep --strict "${mounted_apps[0]}"; then
              echo "0.x macOS application must be unsigned" >&2
              exit 1
            fi
          fi
          ditto --noqtn "${mounted_apps[0]}" "$installed_app"
          export ANCESTRYLLM_PACKAGED_APP="$installed_app/Contents/MacOS/ancestryllm"
          pnpm --dir desktop run test:e2e:packaged \
            --grep "exercises first run, persistence, corrupt preferences, security, and resource evidence"
      - name: Unmount macOS validation installer
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          if mount | grep -Fq "$RUNNER_TEMP/ancestryllm-validation-dmg"; then
            hdiutil detach "$RUNNER_TEMP/ancestryllm-validation-dmg"
          fi
      - name: Verify and exercise Windows 11 application
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          INSTALLER: ${{ steps.installer.outputs.path }}
          WINDOWS_SIGNING_CERTIFICATE_THUMBPRINT: ${{ vars.WINDOWS_SIGNING_CERTIFICATE_THUMBPRINT }}
          ANCESTRYLLM_PACKAGED_RUNTIME_PATH: ""
          ANCESTRYLLM_PACKAGED_METRICS: ${{ runner.temp }}/ancestryllm-packaged-metrics.json
        run: |
          $installer = (Resolve-Path -LiteralPath $env:INSTALLER).Path
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          if ($env:BINARY_SIGNING_MODE -eq 'trusted') {
            $expectedThumbprint = ($env:WINDOWS_SIGNING_CERTIFICATE_THUMBPRINT -replace '\s', '').ToUpperInvariant()
            if ($expectedThumbprint -notmatch '^[0-9A-F]{40}$') { throw 'WINDOWS_SIGNING_CERTIFICATE_THUMBPRINT must be a complete 40-character SHA-1 certificate thumbprint' }
            if ($signature.Status -ne 'Valid') { throw "installer Authenticode status is $($signature.Status)" }
            if ($signature.SignerCertificate.Thumbprint.ToUpperInvariant() -ne $expectedThumbprint) { throw 'installer signer certificate thumbprint does not match the approved identity' }
          } elseif ($signature.Status -ne 'NotSigned') {
            throw "unsigned installer Authenticode status is $($signature.Status)"
          }
          $statePath = Join-Path $env:RUNNER_TEMP 'ancestryllm-install-root.txt'
          Remove-Item -LiteralPath $statePath -Force -ErrorAction SilentlyContinue
          $process = Start-Process -FilePath $installer -ArgumentList @('/S', '/currentuser') -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "NSIS installer exited $($process.ExitCode)" }
          $displayName = "AncestryLLM $env:VERSION"
          $registrations = @(
            Get-ChildItem -LiteralPath 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall' |
              ForEach-Object {
                $registration = Get-ItemProperty -LiteralPath $_.PSPath
                if (
                  $registration.DisplayName -eq $displayName -and
                  $registration.DisplayVersion -eq $env:VERSION
                ) {
                  $registration
                }
              }
          )
          if ($registrations.Count -ne 1) {
            throw "expected one $displayName uninstall registration, found $($registrations.Count)"
          }
          $uninstallCommand = [string]$registrations[0].QuietUninstallString
          if ([string]::IsNullOrWhiteSpace($uninstallCommand)) { throw 'installed application registration has no QuietUninstallString' }
          if ($uninstallCommand -notmatch '^"(?<path>[^"]+)"(?:\s|$)') {
            throw "unexpected quiet uninstall command $uninstallCommand"
          }
          $uninstaller = $Matches.path
          if ((Split-Path -Leaf $uninstaller) -ine 'Uninstall AncestryLLM.exe') { throw "unexpected registered uninstaller $uninstaller" }
          if (-not (Test-Path -LiteralPath $uninstaller -PathType Leaf)) { throw "registered uninstaller is absent: $uninstaller" }
          $localAppData = [IO.Path]::GetFullPath([Environment]::GetFolderPath('LocalApplicationData')).TrimEnd('\')
          $installRoot = [IO.Path]::GetFullPath((Split-Path -Parent $uninstaller)).TrimEnd('\')
          if (-not $installRoot.StartsWith("$localAppData\", [StringComparison]::OrdinalIgnoreCase)) {
            throw "unexpected install root outside LocalApplicationData: $installRoot"
          }
          $resourceMarkers = @(
            Get-ChildItem -LiteralPath $installRoot -Filter 'app.asar' -File -Recurse |
              Where-Object { $_.Directory.Name -ieq 'resources' }
          )
          if ($resourceMarkers.Count -ne 1) {
            throw "expected one installed Electron resources marker beneath $installRoot, found $($resourceMarkers.Count)"
          }
          $resourcesPath = $resourceMarkers[0].Directory.FullName
          $application = Join-Path (Split-Path -Parent $resourcesPath) 'ancestryllm.exe'
          if (-not (Test-Path -LiteralPath $application -PathType Leaf)) { throw "installed application is absent: $application" }
          Set-Content -LiteralPath $statePath -Value $installRoot -NoNewline
          $applicationSignature = Get-AuthenticodeSignature -LiteralPath $application
          if ($env:BINARY_SIGNING_MODE -eq 'trusted') {
            if ($applicationSignature.Status -ne 'Valid') { throw "application Authenticode status is $($applicationSignature.Status)" }
            if ($applicationSignature.SignerCertificate.Thumbprint.ToUpperInvariant() -ne $expectedThumbprint) { throw 'application signer certificate thumbprint does not match the approved identity' }
          } elseif ($applicationSignature.Status -ne 'NotSigned') {
            throw "unsigned application Authenticode status is $($applicationSignature.Status)"
          }
          $env:ANCESTRYLLM_PACKAGED_APP = $application
          pnpm --dir desktop run test:e2e:packaged --grep "exercises first run, persistence, corrupt preferences, security, and resource evidence"
          if ($LASTEXITCODE -ne 0) { throw "packaged Electron test exited $LASTEXITCODE" }
      - name: Remove temporary Windows validation installation
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $statePath = Join-Path $env:RUNNER_TEMP 'ancestryllm-install-root.txt'
          $installRoots = @()
          if (Test-Path -LiteralPath $statePath -PathType Leaf) {
            $installRoot = (Get-Content -LiteralPath $statePath -Raw).Trim()
            if ([string]::IsNullOrWhiteSpace($installRoot)) { throw 'recorded Windows install root is empty' }
            $installRoots += $installRoot
          }
          if ($installRoots.Count -eq 0) {
            $displayName = "AncestryLLM $env:VERSION"
            Get-ChildItem -LiteralPath 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall' -ErrorAction SilentlyContinue |
              ForEach-Object {
                $registration = Get-ItemProperty -LiteralPath $_.PSPath
                if (
                  $registration.DisplayName -eq $displayName -and
                  $registration.DisplayVersion -eq $env:VERSION
                ) {
                  $uninstallCommand = [string]$registration.QuietUninstallString
                  if ([string]::IsNullOrWhiteSpace($uninstallCommand)) { throw 'installed application registration has no QuietUninstallString' }
                  if ($uninstallCommand -notmatch '^"(?<path>[^"]+)"(?:\s|$)') {
                    throw "unexpected quiet uninstall command $uninstallCommand"
                  }
                  $uninstaller = $Matches.path
                  if ((Split-Path -Leaf $uninstaller) -ine 'Uninstall AncestryLLM.exe') { throw "unexpected registered uninstaller $uninstaller" }
                  $installRoots += (Split-Path -Parent $uninstaller)
                }
              }
          }
          $installRoots = @($installRoots | Select-Object -Unique)
          $localAppData = [IO.Path]::GetFullPath([Environment]::GetFolderPath('LocalApplicationData')).TrimEnd('\')
          foreach ($installRoot in $installRoots) {
            $installRoot = [IO.Path]::GetFullPath($installRoot).TrimEnd('\')
            if (-not $installRoot.StartsWith("$localAppData\", [StringComparison]::OrdinalIgnoreCase)) {
              throw "refusing cleanup outside LocalApplicationData: $installRoot"
            }
            $uninstaller = Join-Path $installRoot 'Uninstall AncestryLLM.exe'
            if (Test-Path -LiteralPath $uninstaller -PathType Leaf) {
              $process = Start-Process -FilePath $uninstaller -ArgumentList @('/S', '/currentuser') -Wait -PassThru
              if ($process.ExitCode -ne 0) { throw "NSIS uninstaller exited $($process.ExitCode)" }
            }
            Remove-Item -LiteralPath $installRoot -Recurse -Force -ErrorAction SilentlyContinue
          }
          Remove-Item -LiteralPath $statePath -Force -ErrorAction SilentlyContinue
      - name: Verify, install, and exercise Ubuntu application
        if: runner.os == 'Linux'
        shell: bash
        env:
          INSTALLER: ${{ steps.installer.outputs.path }}
          LINUX_GPG_PUBLIC_KEY_BASE64: ${{ vars.LINUX_GPG_PUBLIC_KEY_BASE64 }}
          LINUX_GPG_SIGNING_FINGERPRINT: ${{ vars.LINUX_GPG_SIGNING_FINGERPRINT }}
          ANCESTRYLLM_PACKAGED_RUNTIME_PATH: ""
          ANCESTRYLLM_PACKAGED_METRICS: ${{ runner.temp }}/ancestryllm-packaged-metrics.json
        run: |
          if [[ "$BINARY_SIGNING_MODE" == "trusted" ]]; then
            test -n "$LINUX_GPG_PUBLIC_KEY_BASE64"
            test -n "$LINUX_GPG_SIGNING_FINGERPRINT"
            expected_fingerprint="$(printf '%s' "$LINUX_GPG_SIGNING_FINGERPRINT" | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')"
            case "$expected_fingerprint" in
              *[!0-9A-F]*) echo "Linux signing fingerprint must contain only hexadecimal characters" >&2; exit 1 ;;
            esac
            case "${#expected_fingerprint}" in
              40|64) ;;
              *) echo "Linux signing fingerprint must be a complete 40- or 64-character fingerprint" >&2; exit 1 ;;
            esac
            test -s "$INSTALLER.asc"
            verification_home="$RUNNER_TEMP/ancestryllm-public-verification-gnupg"
            install -d -m 700 "$verification_home"
            printf '%s' "$LINUX_GPG_PUBLIC_KEY_BASE64" | base64 --decode \
              > "$RUNNER_TEMP/ancestryllm-release-public-key.asc"
            GNUPGHOME="$verification_home" gpg --batch --import \
              "$RUNNER_TEMP/ancestryllm-release-public-key.asc"
            if GNUPGHOME="$verification_home" gpg --batch --with-colons --list-secret-keys | grep -q '^sec:'; then
              echo "verification keyring unexpectedly contains a private key" >&2
              exit 1
            fi
            GNUPGHOME="$verification_home" gpg --batch --with-colons --fingerprint --list-keys | \
              awk -F: '$1 == "fpr" { print toupper($10) }' | grep -Fxq "$expected_fingerprint"
            GNUPGHOME="$verification_home" gpg --batch --status-fd 1 --verify \
              "$INSTALLER.asc" "$INSTALLER" | tee "$RUNNER_TEMP/ancestryllm-public-gpg-status.txt"
            grep -Fq "[GNUPG:] VALIDSIG $expected_fingerprint " \
              "$RUNNER_TEMP/ancestryllm-public-gpg-status.txt"
          else
            test ! -e "$INSTALLER.asc"
          fi
          sudo apt-get install -y "./$INSTALLER"
          dpkg-query --show ancestryllm-desktop
          test -x /opt/AncestryLLM/ancestryllm
          export ANCESTRYLLM_PACKAGED_APP=/opt/AncestryLLM/ancestryllm
          xvfb-run --auto-servernum pnpm --dir desktop run test:e2e:packaged \
            --grep "exercises first run, persistence, corrupt preferences, security, and resource evidence"
      - name: Remove temporary Ubuntu validation installation
        if: always() && runner.os == 'Linux'
        shell: bash
        run: |
          sudo dpkg -r ancestryllm-desktop 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/ancestryllm-public-verification-gnupg"
          rm -f "$RUNNER_TEMP/ancestryllm-release-public-key.asc" \
            "$RUNNER_TEMP/ancestryllm-public-gpg-status.txt"
      - name: Record exact installer validation receipt
        shell: bash
        env:
          INSTALLER: ${{ steps.installer.outputs.path }}
          VALIDATION_RUNNER: ${{ matrix.runner }}
          SIDECAR_TARGET: ${{ matrix.sidecar_target }}
          EXPECTED_OS: ${{ matrix.expected_os }}
          ACTUAL_OS: ${{ steps.macos-host.outputs.actual_os || steps.windows-host.outputs.actual_os || steps.linux-host.outputs.actual_os }}
          TARGET_ARCH: ${{ matrix.arch }}
          HOST_ARCH: ${{ matrix.host_arch || matrix.arch }}
          SOURCE_ARTIFACT_ID: ${{ steps.source.outputs.artifact_id }}
          SOURCE_ARTIFACT_DIGEST: ${{ steps.source.outputs.artifact_digest }}
        run: |
          row_dir="desktop-validation-row"
          mkdir "$row_dir"
          installer_name="$(basename "$INSTALLER")"
          cp "$INSTALLER" "$row_dir/$installer_name"
          python scripts/assemble_desktop_release.py validation-receipt \
            --git-head "$EXPECTED_HEAD" \
            --version "$VERSION" \
            --runner "$VALIDATION_RUNNER" \
            --target "$SIDECAR_TARGET" \
            --expected-os "$EXPECTED_OS" \
            --actual-os "$ACTUAL_OS" \
            --arch "$TARGET_ARCH" \
            --host-arch "$HOST_ARCH" \
            --installer "$row_dir/$installer_name" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --source-artifact-id "$SOURCE_ARTIFACT_ID" \
            --source-artifact-digest "$SOURCE_ARTIFACT_DIGEST" \
            --gate exactHeadPassed \
            --gate installedRuntimePassed \
            --gate operatingSystemPassed \
            --gate runtimeIsolationPassed \
            --gate sidecarHandshakePassed \
            --output "$row_dir/desktop-validation-receipt.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-validation-${{ matrix.runner }}
          path: desktop-validation-row/
          if-no-files-found: error

  desktop-release-aggregate:
    name: aggregate validated desktop release candidate
    if: github.event_name == 'workflow_dispatch'
    needs: [validate, desktop-installers, desktop-installer-validation]
    runs-on: ubuntu-24.04
    permissions:
      actions: read # required to verify and aggregate this run's installer and validation artifacts
      contents: read # required to inspect the exact release commit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: desktop-installer-*
          path: desktop-installer-evidence
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: desktop-validation-*
          path: desktop-validation-evidence
      - name: Verify receipt provenance against this exact workflow run
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ needs.validate.outputs.commit }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            > "$RUNNER_TEMP/release-run-artifacts.json"
          python - "$RUNNER_TEMP/release-run-artifacts.json" \
            desktop-validation-evidence "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            "$COMMIT_SHA" "$VERSION" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          metadata_path, receipts_dir, run_id, run_attempt, commit, version = sys.argv[1:]
          artifacts = json.loads(Path(metadata_path).read_text(encoding="utf-8"))["artifacts"]
          by_id = {item["id"]: item for item in artifacts}
          if len(by_id) != len(artifacts):
              raise SystemExit("release workflow returned duplicate artifact IDs")

          target_names = {
              "desktop-installer-darwin-arm64",
              "desktop-installer-darwin-x64",
              "desktop-installer-win32-arm64",
              "desktop-installer-linux-x64",
          }
          validation_names = {
              "desktop-validation-macos-15",
              "desktop-validation-macos-15-intel",
              "desktop-validation-macos-26",
              "desktop-validation-macos-26-intel",
              "desktop-validation-windows-11-arm",
              "desktop-validation-ubuntu-24.04",
          }
          names = [item["name"] for item in artifacts if not item["expired"]]
          for expected in target_names | validation_names:
              if names.count(expected) != 1:
                  raise SystemExit(f"expected exactly one unexpired workflow artifact {expected}")

          receipts = sorted(Path(receipts_dir).rglob("desktop-validation-receipt.json"))
          if len(receipts) != len(validation_names):
              raise SystemExit("desktop validation receipt matrix is incomplete")
          runners: set[str] = set()
          source_names: set[str] = set()
          for path in receipts:
              receipt = json.loads(path.read_text(encoding="utf-8"))
              if receipt["gitHead"] != commit or receipt["version"] != version:
                  raise SystemExit(f"validation receipt {path} has the wrong release identity")
              runner = receipt["runner"]
              if runner in runners:
                  raise SystemExit(f"duplicate validation receipt for {runner}")
              runners.add(runner)
              workflow = receipt["workflow"]
              if workflow["runId"] != int(run_id) or workflow["runAttempt"] != int(run_attempt):
                  raise SystemExit(f"validation receipt {runner} belongs to another workflow run")
              source = by_id.get(workflow["sourceArtifactId"])
              expected_name = f"desktop-installer-{receipt['target']}"
              if source is None or source["name"] != expected_name or source["expired"]:
                  raise SystemExit(f"validation receipt {runner} names an invalid source artifact")
              if source["digest"] != workflow["sourceArtifactDigest"]:
                  raise SystemExit(f"validation receipt {runner} source digest is stale")
              if not re.fullmatch(r"sha256:[0-9a-f]{64}", source["digest"]):
                  raise SystemExit(f"validation receipt {runner} source digest is invalid")
              source_names.add(source["name"])
          if source_names != target_names:
              raise SystemExit("validation receipts do not cover every installer artifact")
          PY
      - name: Aggregate exact installers, validation evidence, and SBOMs
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          COMMIT_SHA: ${{ needs.validate.outputs.commit }}
          BINARY_SIGNING_MODE: ${{ needs.validate.outputs.binary_signing_mode }}
        run: |
          test "$(git rev-parse HEAD)" = "$COMMIT_SHA"
          python scripts/assemble_desktop_release.py aggregate \
            --git-head "$COMMIT_SHA" \
            --version "$VERSION" \
            --input-dir desktop-installer-evidence \
            --validation-dir desktop-validation-evidence \
            --output-dir dist
          test -f dist/desktop-artifact-manifest.json
          test -f dist/desktop-sbom.json
          test -f dist/desktop-exact-head-evidence.json
          python scripts/generate_release_checksums.py --directory dist
      - id: desktop_release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-release-distributions-${{ needs.validate.outputs.version }}-${{ needs.validate.outputs.commit }}
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - name: Record the release-tag approval coordinates
        env:
          ARTIFACT_ID: ${{ steps.desktop_release.outputs.artifact-id }}
          RAW_ARTIFACT_DIGEST: ${{ steps.desktop_release.outputs.artifact-digest }}
          RELEASE_TAG_MODE: ${{ needs.validate.outputs.release_tag_mode }}
        run: |
          if [[ "$RAW_ARTIFACT_DIGEST" =~ ^[0-9A-Fa-f]{64}$ ]]; then
            ARTIFACT_DIGEST="sha256:${RAW_ARTIFACT_DIGEST,,}"
          else
            ARTIFACT_DIGEST="${RAW_ARTIFACT_DIGEST,,}"
          fi
          [[ "$ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          {
            echo "### Approved desktop release candidate"
            echo
            echo "Release tag mode: \`$RELEASE_TAG_MODE\`"
            echo
            echo 'Add these exact lines to the annotated release tag:'
            echo '```text'
            echo "Desktop-Release-Run-ID: $GITHUB_RUN_ID"
            echo "Desktop-Release-Artifact-ID: $ARTIFACT_ID"
            echo "Desktop-Release-Artifact-Digest: $ARTIFACT_DIGEST"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  import-desktop-release-distributions:
    name: import approved desktop release candidate
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      actions: read # required to download the exact approved workflow artifact by ID
      contents: read # required to verify the annotated release tag and release commit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Download the exact approved artifact without name fallback
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_RUN: ${{ needs.validate.outputs.desktop_release_run }}
          APPROVED_ARTIFACT: ${{ needs.validate.outputs.desktop_release_artifact }}
          APPROVED_DIGEST: ${{ needs.validate.outputs.desktop_release_digest }}
          EXPECTED_NAME: desktop-release-distributions-${{ needs.validate.outputs.version }}-${{ needs.validate.outputs.commit }}
        run: |
          metadata="$RUNNER_TEMP/approved-desktop-artifact.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$APPROVED_ARTIFACT" > "$metadata"
          test "$(jq -r '.workflow_run.id' "$metadata")" = "$APPROVED_RUN"
          test "$(jq -r '.name' "$metadata")" = "$EXPECTED_NAME"
          test "$(jq -r '.expired' "$metadata")" = "false"
          test "$(jq -r '.digest' "$metadata")" = "$APPROVED_DIGEST"
          archive="$RUNNER_TEMP/approved-desktop-release.zip"
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$APPROVED_ARTIFACT/zip" \
            --output "$archive"
          python - "$archive" "$APPROVED_DIGEST" imported <<'PY'
          import hashlib
          import stat
          import sys
          import zipfile
          from pathlib import Path, PurePosixPath

          archive, expected, destination = Path(sys.argv[1]), sys.argv[2], Path(sys.argv[3])
          actual = "sha256:" + hashlib.sha256(archive.read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit(f"approved artifact archive digest {actual} != {expected}")
          destination.mkdir()
          with zipfile.ZipFile(archive) as bundle:
              names: set[str] = set()
              for member in bundle.infolist():
                  name = member.filename
                  path = PurePosixPath(name)
                  mode = member.external_attr >> 16
                  if (
                      not name
                      or "\\" in name
                      or path.is_absolute()
                      or ".." in path.parts
                      or name in names
                      or stat.S_ISLNK(mode)
                  ):
                      raise SystemExit(f"unsafe approved artifact member: {name!r}")
                  names.add(name)
              bundle.extractall(destination)
          PY
      - name: Verify approved desktop inventory and exact-head evidence
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          COMMIT_SHA: ${{ needs.validate.outputs.commit }}
          BINARY_SIGNING_MODE: ${{ needs.validate.outputs.binary_signing_mode }}
          APPROVED_RUN: ${{ needs.validate.outputs.desktop_release_run }}
          APPROVED_ARTIFACT: ${{ needs.validate.outputs.desktop_release_artifact }}
          APPROVED_DIGEST: ${{ needs.validate.outputs.desktop_release_digest }}
          TAG_NAME: ${{ github.ref_name }}
          RELEASE_TAG_MODE: ${{ needs.validate.outputs.release_tag_mode }}
        run: |
          python scripts/verify_release_assets.py --expected imported --actual imported
          python - imported "$VERSION" "$COMMIT_SHA" <<'PY'
          import hashlib
          import json
          import os
          import re
          import sys
          from pathlib import Path

          root, version, commit = Path(sys.argv[1]), sys.argv[2], sys.argv[3]
          entries = list(root.iterdir())
          if any(path.is_symlink() or not path.is_file() for path in entries):
              raise SystemExit("approved desktop artifact must contain only direct regular files")
          manifest = json.loads((root / "desktop-artifact-manifest.json").read_text(encoding="utf-8"))
          evidence = json.loads((root / "desktop-exact-head-evidence.json").read_text(encoding="utf-8"))
          if (
              manifest.get("schemaVersion") != 2
              or manifest.get("version") != version
              or manifest.get("gitHead") != commit
              or manifest.get("binarySigningMode") != os.environ["BINARY_SIGNING_MODE"]
          ):
              raise SystemExit("desktop artifact manifest has the wrong release identity")
          if (
              evidence.get("schemaVersion") != 3
              or evidence.get("version") != version
              or evidence.get("gitHead") != commit
              or evidence.get("binarySigningMode") != os.environ["BINARY_SIGNING_MODE"]
          ):
              raise SystemExit("desktop exact-head evidence has the wrong release identity")
          if evidence.get("status") != "passed" or evidence.get("platformValidated") is not True:
              raise SystemExit("desktop exact-head evidence is not publication eligible")
          artifacts = manifest.get("artifacts")
          if not isinstance(artifacts, list):
              raise SystemExit("desktop artifact manifest is malformed")
          artifact_names = {row.get("name") for row in artifacts if isinstance(row, dict)}
          if len(artifact_names) != len(artifacts) or not all(
              isinstance(name, str) and Path(name).name == name for name in artifact_names
          ):
              raise SystemExit("desktop artifact manifest contains unsafe or duplicate names")
          reserved_names = {
              "desktop-artifact-manifest.json",
              "desktop-exact-head-evidence.json",
              "desktop-sbom.json",
              "SHA256SUMS",
          }
          if artifact_names & reserved_names:
              raise SystemExit("desktop artifact manifest collides with release metadata")
          for row in artifacts:
              if set(row) != {"name", "bytes", "sha256"}:
                  raise SystemExit("desktop artifact manifest row is malformed")
              path = root / row["name"]
              byte_count = row["bytes"]
              digest = row["sha256"]
              if (
                  isinstance(byte_count, bool)
                  or not isinstance(byte_count, int)
                  or byte_count < 0
                  or not isinstance(digest, str)
                  or not re.fullmatch(r"[0-9a-f]{64}", digest)
              ):
                  raise SystemExit("desktop artifact manifest row is malformed")
              actual_digest = hashlib.sha256(path.read_bytes()).hexdigest()
              if path.stat().st_size != byte_count or actual_digest != digest:
                  raise SystemExit(f"desktop artifact manifest digest mismatch: {path.name}")
          expected_files = artifact_names | {
              "desktop-artifact-manifest.json",
              "desktop-exact-head-evidence.json",
              "desktop-sbom.json",
              "SHA256SUMS",
          }
          if {path.name for path in entries} != expected_files:
              raise SystemExit("approved desktop artifact inventory is not manifest exact")
          expected_validations = {
              ("macos-15", "darwin-arm64", "macOS 15", "macOS 15", "arm64", "arm64"),
              ("macos-15-intel", "darwin-x64", "macOS 15", "macOS 15", "x64", "x64"),
              ("macos-26", "darwin-arm64", "macOS 26", "macOS 26", "arm64", "arm64"),
              ("macos-26-intel", "darwin-x64", "macOS 26", "macOS 26", "x64", "x64"),
              ("windows-11-arm", "win32-arm64", "Windows 11", "Windows 11", "arm64", "arm64"),
              ("ubuntu-24.04", "linux-x64", "Ubuntu 24.04", "Ubuntu 24.04", "x64", "x64"),
          }
          validation_rows = evidence.get("validations", [])
          if not isinstance(validation_rows, list) or len(validation_rows) != len(
              expected_validations
          ):
              raise SystemExit("approved desktop validation matrix is incomplete")
          actual_validations = {
              (
                  row["runner"],
                  row["target"],
                  row["expectedOs"],
                  row["actualOs"],
                  row["arch"],
                  row["hostArch"],
              )
              for row in validation_rows
              if isinstance(row, dict)
          }
          if len(actual_validations) != len(validation_rows) or actual_validations != (
              expected_validations
          ):
              raise SystemExit("approved desktop validation matrix is incomplete")
          PY
          mv imported/SHA256SUMS imported/desktop-aggregate-SHA256SUMS
          python - imported/desktop-approved-artifact.json <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          payload = {
              "schemaVersion": 1,
              "status": "approved",
              "version": os.environ["VERSION"],
              "gitHead": os.environ["COMMIT_SHA"],
              "releaseTag": os.environ["TAG_NAME"],
              "releaseTagMode": os.environ["RELEASE_TAG_MODE"],
              "workflowRunId": int(os.environ["APPROVED_RUN"]),
              "artifactId": int(os.environ["APPROVED_ARTIFACT"]),
              "artifactDigest": os.environ["APPROVED_DIGEST"],
          }
          Path(sys.argv[1]).write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: imported-desktop-release-distributions
          path: imported/
          if-no-files-found: error

  assemble-release-distributions:
    name: assemble immutable Python and desktop release distributions
    if: github.event_name == 'push'
    needs: [validate, build, import-desktop-release-distributions]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-release-distributions
          path: python-release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: imported-desktop-release-distributions
          path: desktop-release
      - name: Merge exact release assets and regenerate final evidence
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          COMMIT_SHA: ${{ needs.validate.outputs.commit }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - python-release desktop-release dist <<'PY'
          import shutil
          import sys
          from pathlib import Path

          python_dir, desktop_dir, output_dir = map(Path, sys.argv[1:])
          output_dir.mkdir()
          for source_dir, skipped in (
              (python_dir, {"SHA256SUMS", "release-evidence.md"}),
              (desktop_dir, set()),
          ):
              for source in source_dir.iterdir():
                  if source.name in skipped:
                      continue
                  if source.is_symlink() or not source.is_file() or source.name.startswith("."):
                      raise SystemExit(f"unsupported release input: {source}")
                  destination = output_dir / source.name
                  if destination.exists():
                      raise SystemExit(f"release asset collision: {source.name}")
                  shutil.copyfile(source, destination)
          PY
          python scripts/create_release_evidence.py \
            --version "$VERSION" \
            --commit "$COMMIT_SHA" \
            --run-url "$RUN_URL" \
            --artifacts dist \
            --gates dist/gates.json \
            --findings dist/findings-dispositions.json \
            --interoperability dist/interoperability.json \
            --output dist/release-evidence.md
          python scripts/generate_release_checksums.py --directory dist
          python scripts/verify_release_assets.py --expected dist --actual dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-distributions
          path: dist/
          if-no-files-found: error

  publish-build-provenance:
    name: publish build provenance
    if: github.event_name == 'push'
    needs: [validate, assemble-release-distributions]
    runs-on: ubuntu-latest
    permissions:
      attestations: write # required to persist build provenance
      contents: read # required to associate attestations with the repository
      id-token: write # required to sign build provenance
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-distributions
          path: dist
      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/*

  draft-github-release:
    name: prepare draft GitHub Release
    if: github.event_name == 'push'
    needs: [validate, assemble-release-distributions, publish-build-provenance]
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create and attach assets to the draft release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-distributions
          path: dist
      - name: Create or verify draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Reusing an existing, exact draft without modifying it."
          else
            gh release create "$TAG_NAME" --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag --title "AncestryLLM $VERSION" \
              --notes-file dist/release-notes.md
            gh release upload "$TAG_NAME" dist/* --repo "$GITHUB_REPOSITORY"
          fi
          release_json="$(
            gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" \
              --json isDraft,name,body
          )"
          test "$(jq -r '.isDraft' <<<"$release_json")" = "true"
          test "$(jq -r '.name' <<<"$release_json")" = "AncestryLLM $VERSION"
          test "$(jq -r '.body' <<<"$release_json")" = "$(cat dist/release-notes.md)"
          mkdir downloaded
          gh release download "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --dir downloaded
          python scripts/verify_release_assets.py \
            --expected dist \
            --actual downloaded

  publish-testpypi:
    name: publish TestPyPI
    if: github.event_name == 'push'
    needs: [validate, assemble-release-distributions, publish-build-provenance, draft-github-release]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/ancestryllm
    permissions:
      id-token: write # required for TestPyPI trusted publishing
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-distributions
          path: release
      - name: Select Python distributions
        run: |
          mkdir dist
          cp release/*.whl release/*.tar.gz dist/
      - uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
        with:
          attestations: false # TestPyPI lacks PyPI's PEP 740 Integrity API
          repository-url: https://test.pypi.org/legacy/

  verify-testpypi:
    name: verify TestPyPI
    if: github.event_name == 'push'
    needs: [validate, assemble-release-distributions, publish-testpypi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-distributions
          path: release
      - name: Download exact TestPyPI files and verify hashes
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          for attempt in {1..12}; do
            if python scripts/verify_index_artifacts.py \
              --index https://test.pypi.org \
              --version "$VERSION" \
              --checksums release/SHA256SUMS \
              --output downloaded; then
              break
            fi
            test "$attempt" -lt 12
            sleep 10
          done

  publish-pypi:
    name: publish PyPI
    if: github.event_name == 'push'
    needs: [validate, assemble-release-distributions, draft-github-release, verify-testpypi]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ancestryllm
    permissions:
      id-token: write # required for PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-distributions
          path: release
      - name: Select Python distributions
        run: |
          mkdir dist
          cp release/*.whl release/*.tar.gz dist/
      - uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
        with:
          attestations: true

  verify-pypi-hashes:
    name: verify PyPI hashes and PEP 740 attestations
    if: github.event_name == 'push'
    needs: [validate, assemble-release-distributions, publish-pypi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-distributions
          path: release
      - name: Download exact PyPI files and verify hashes
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          for attempt in {1..12}; do
            if python scripts/verify_index_artifacts.py \
              --index https://pypi.org \
              --version "$VERSION" \
              --checksums release/SHA256SUMS \
              --output downloaded; then
              break
            fi
            test "$attempt" -lt 12
            sleep 10
          done
      - name: Verify PyPI PEP 740 attestations
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          python -m pip install --disable-pip-version-check uv==0.12.1
          python scripts/verify_pypi_attestations.py \
            --version "$VERSION" \
            --repository "$GITHUB_REPOSITORY" \
            --verifier pypi-attestations==0.0.30 \
            --checksums downloaded/SHA256SUMS \
            --artifacts downloaded \
            --evidence attestation-evidence
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-pypi-distributions
          path: downloaded/
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-pypi-attestations
          path: attestation-evidence/
          if-no-files-found: error

  verify-pypi-install:
    name: verify PyPI ${{ matrix.artifact }} install (${{ matrix.os }}, ${{ matrix.python }})
    if: github.event_name == 'push'
    needs: [validate, verify-pypi-hashes]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13", "3.14"]
        artifact: [wheel, sdist]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-pypi-distributions
          path: downloaded
      - name: Install verified PyPI artifact and smoke-test offline CLI
        shell: bash
        env:
          ARTIFACT: ${{ matrix.artifact }}
          VERSION: ${{ needs.validate.outputs.version }}
          ANCESTRYLLM_CONFIG_DIR: ${{ runner.temp }}/ancestryllm/config
          ANCESTRYLLM_DATA_DIR: ${{ runner.temp }}/ancestryllm/data
        run: |
          python scripts/verify_release_assets.py \
            --expected downloaded \
            --actual downloaded
          if test "$ARTIFACT" = "wheel"; then
            packages=(downloaded/*.whl)
          else
            packages=(downloaded/*.tar.gz)
          fi
          test "${#packages[@]}" -eq 1
          python -m pip install --disable-pip-version-check "${packages[0]}"
          test "$(ancestry --version)" = "ancestry $VERSION"
          ancestry --json modules list > modules.json
          python -c 'import json; assert json.load(open("modules.json", encoding="utf-8"))'

  verify-docs-publication:
    name: verify documentation publication for release commit
    if: github.event_name == 'push'
    needs: [validate]
    runs-on: ubuntu-latest
    permissions:
      actions: read # required to query workflow runs for Pages and Wiki
    steps:
      - name: Verify GitHub Pages deployment for release commit
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ needs.validate.outputs.commit }}
        run: |
          pages_run="$(
            gh api \
              "repos/$GITHUB_REPOSITORY/actions/workflows/jekyll-gh-pages.yml/runs?event=push&status=success&head_sha=$COMMIT&per_page=10" \
              --jq '.workflow_runs[0].id // empty'
          )"
          if test -z "$pages_run"; then
            echo "ERROR: No successful 'Deploy documentation site' (jekyll-gh-pages.yml) run found for commit $COMMIT." >&2
            echo "Remediation: ensure the jekyll-gh-pages.yml push workflow completed successfully on main" >&2
            echo "before pushing the release tag, then re-run this workflow." >&2
            exit 1
          fi
          echo "GitHub Pages deployment verified: run $pages_run for commit $COMMIT"
      - name: Check whether docs changed for release commit
        id: docs-changed
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ needs.validate.outputs.commit }}
        run: |
          # Determine if docs/** changed in the release commit.
          changed="$(
            gh api "repos/$GITHUB_REPOSITORY/commits/$COMMIT" \
              --jq '[.files[].filename | select(startswith("docs/"))] | length'
          )"
          if test "$changed" -gt 0; then
            echo "docs_changed=true" >> "$GITHUB_OUTPUT"
            echo "docs/ changed in $COMMIT ($changed file(s)); Wiki sync is required."
          else
            echo "docs_changed=false" >> "$GITHUB_OUTPUT"
            echo "docs/ did not change in $COMMIT; Wiki sync is not required."
          fi
      - name: Verify Wiki synchronization for release commit
        if: steps.docs-changed.outputs.docs_changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ needs.validate.outputs.commit }}
        run: |
          wiki_run="$(
            gh api \
              "repos/$GITHUB_REPOSITORY/actions/workflows/sync-wiki.yml/runs?event=push&status=success&head_sha=$COMMIT&per_page=10" \
              --jq '.workflow_runs[0].id // empty'
          )"
          if test -z "$wiki_run"; then
            echo "ERROR: docs/ changed for commit $COMMIT but no successful 'Sync Wiki' (sync-wiki.yml) run was found." >&2
            echo "Remediation: ensure the sync-wiki.yml push workflow completed successfully on main" >&2
            echo "before pushing the release tag, then re-run this workflow." >&2
            exit 1
          fi
          echo "Wiki synchronization verified: run $wiki_run for commit $COMMIT"

  publish-github-release:
    name: publish immutable GitHub Release
    if: github.event_name == 'push'
    needs: [validate, assemble-release-distributions, draft-github-release, verify-pypi-hashes, verify-pypi-install, verify-docs-publication]
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to publish the prepared GitHub Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-distributions
          path: expected
      - name: Verify and publish prepared draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          release_json="$(
            gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" \
              --json isDraft,name,body
          )"
          test "$(jq -r '.isDraft' <<<"$release_json")" = "true"
          test "$(jq -r '.name' <<<"$release_json")" = "AncestryLLM $VERSION"
          test "$(jq -r '.body' <<<"$release_json")" = "$(cat expected/release-notes.md)"
          mkdir downloaded
          gh release download "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --dir downloaded
          python scripts/verify_release_assets.py \
            --expected expected \
            --actual downloaded
          release_json="$(
            gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" \
              --json isDraft,name,body
          )"
          test "$(jq -r '.isDraft' <<<"$release_json")" = "true"
          test "$(jq -r '.name' <<<"$release_json")" = "AncestryLLM $VERSION"
          test "$(jq -r '.body' <<<"$release_json")" = "$(cat expected/release-notes.md)"
          gh release edit "$TAG_NAME" --repo "$GITHUB_REPOSITORY" \
            --draft=false --latest
