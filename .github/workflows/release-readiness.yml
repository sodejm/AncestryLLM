name: Release readiness

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact main commit to approve
        required: true
        type: string
      version:
        description: Stable SemVer package version
        required: true
        type: string
      lifecycle_cleanup_confirmed:
        description: Confirm lifecycle audit and every safe branch/worktree cleanup are recorded
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-readiness-${{ inputs.commit_sha }}
  cancel-in-progress: false

jobs:
  validate:
    name: validate candidate
    runs-on: ubuntu-latest
    permissions:
      contents: read # required to verify the candidate commit
      issues: read # required to verify Project issue dependencies
    outputs:
      version: ${{ steps.candidate.outputs.version }}
      commit: ${{ steps.candidate.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: candidate
        name: Verify exact main commit and version
        env:
          GH_TOKEN: ${{ github.token }}
          PROJECT_READ_TOKEN: ${{ secrets.ANCESTRYLLM_PROJECT_READ_TOKEN }}
          EXPECTED_COMMIT: ${{ inputs.commit_sha }}
          EXPECTED_VERSION: ${{ inputs.version }}
          LIFECYCLE_CLEANUP_CONFIRMED: ${{ inputs.lifecycle_cleanup_confirmed }}
        run: |
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test "$(git rev-parse origin/main)" = "$EXPECTED_COMMIT"
          python - "$EXPECTED_VERSION" <<'PY'
          import re
          import sys
          import tomllib

          expected = sys.argv[1]
          if not re.fullmatch(r"(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)", expected):
              raise SystemExit("version is not stable SemVer")
          with open("pyproject.toml", "rb") as handle:
              actual = str(tomllib.load(handle)["project"]["version"])
          if actual != expected:
              raise SystemExit(f"project version {actual!r} != requested {expected!r}")
          PY
          python scripts/verify_release_configuration.py \
            --config .github/release-config.json \
            --version "$EXPECTED_VERSION"
          test "$LIFECYCLE_CLEANUP_CONFIRMED" = "true"
          project_owner="$(jq -r '.project.owner' .github/release-config.json)"
          project_number="$(jq -r '.project.number' .github/release-config.json)"
          project_title="$(jq -r '.project.title' .github/release-config.json)"
          project_iteration="$(jq -r '.project.iteration' .github/release-config.json)"
          project_priority="$(jq -r '.project.priority' .github/release-config.json)"
          project_status="$(jq -r '.project.status' .github/release-config.json)"
          project_validation="$(jq -r '.project.validation' .github/release-config.json)"
          project_query='query($owner: String!, $number: Int!, $endCursor: String) { user(login: $owner) { projectV2(number: $number) { number title items(first: 100, after: $endCursor) { nodes { id content { __typename ... on Issue { number state repository { nameWithOwner } blockedBy(first: 100) { nodes { number state repository { nameWithOwner } } dependencyPageInfo: pageInfo { hasNextPage endCursor } } } } fieldValues(first: 100) { nodes { __typename ... on ProjectV2ItemFieldSingleSelectValue { name field { ... on ProjectV2SingleSelectField { name } } } ... on ProjectV2ItemFieldIterationValue { title iterationId field { ... on ProjectV2IterationField { name } } } } } } pageInfo { hasNextPage endCursor } } } } }'
          test -n "$PROJECT_READ_TOKEN" || {
            echo "Missing required Actions secret ANCESTRYLLM_PROJECT_READ_TOKEN for private Project read access." >&2
            exit 1
          }
          GH_TOKEN="$PROJECT_READ_TOKEN" gh api graphql --paginate --slurp \
            -f query="$project_query" \
            -f owner="$project_owner" \
            -F number="$project_number" |
            python scripts/verify_release_project.py \
              --project-owner "$project_owner" \
              --project-number "$project_number" \
              --project-title "$project_title" \
              --iteration "$project_iteration" \
              --priority "$project_priority" \
              --status "$project_status" \
              --validation "$project_validation"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo "version=$EXPECTED_VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$EXPECTED_COMMIT" >> "$GITHUB_OUTPUT"

  quality:
    name: quality (${{ matrix.python }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install locked environment
        run: |
          python -m pip install --disable-pip-version-check uv==0.12.0
          uv sync --locked --all-extras
      - name: Test with coverage
        run: uv run python -m pytest --verbose --cov --cov-report=term-missing
      - name: Static quality gates
        if: matrix.python == '3.12'
        run: |
          uv run ruff check src tests scripts
          uv run ruff format --check src tests scripts
          uv run mypy src/ancestryllm
          uv run python scripts/check_architecture_contracts.py
          ./scripts/check_repository_safety.sh
          uv run zizmor --persona=pedantic .github/workflows

  security:
    name: security evidence
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Scan commits for secrets
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          version: 3.95.9
          extra_args: --results=verified,unknown --fail-on-scan-errors
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Dependency and static analysis
        run: |
          python -m pip install --disable-pip-version-check uv==0.12.0
          uv sync --locked --all-extras
          uv run pip-audit
          uv run --locked --script scripts/run_pinned_semgrep.py .
      - name: Generate CycloneDX SBOM
        run: uv run cyclonedx-py environment --output-file sbom.json .venv/bin/python
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-sbom
          path: sbom.json
          if-no-files-found: error

  codeql:
    name: CodeQL evidence
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      actions: read # required by CodeQL for workflow metadata
      contents: read # required to analyze repository contents
      security-events: read # required by CodeQL for repository analysis metadata
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          languages: python
          queries: security-extended
      - uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          output: codeql-sarif
          upload: never
          upload-database: false
      - name: Require zero-result CodeQL evidence
        run: python scripts/verify_codeql_sarif.py --directory codeql-sarif
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: release-codeql-sarif
          path: codeql-sarif/
          if-no-files-found: error
          retention-days: 90

  package:
    name: release package
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Build deterministic distributions
        run: |
          python -m pip install --disable-pip-version-check uv==0.12.0
          uv sync --locked --all-extras
          uv run python scripts/build_release.py --output-dir dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-distributions
          path: dist/
          if-no-files-found: error

  install:
    name: release install (${{ matrix.artifact }}, ${{ matrix.os }}, ${{ matrix.python }})
    needs: [validate, package]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13", "3.14"]
        artifact: [wheel, sdist]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-distributions
          path: dist
      - name: Install and smoke-test
        shell: bash
        env:
          EXPECTED_VERSION: ${{ needs.validate.outputs.version }}
          ARTIFACT_KIND: ${{ matrix.artifact }}
          ANCESTRYLLM_CONFIG_DIR: ${{ runner.temp }}/ancestryllm/config
          ANCESTRYLLM_DATA_DIR: ${{ runner.temp }}/ancestryllm/data
        run: |
          if test "$ARTIFACT_KIND" = "wheel"; then
            artifact=(dist/*.whl)
          else
            artifact=(dist/*.tar.gz)
          fi
          test "${#artifact[@]}" -eq 1
          python -m pip install --disable-pip-version-check "${artifact[0]}"
          test "$(ancestry --version)" = "ancestry $EXPECTED_VERSION"
          ancestry --json modules list > modules.json
          python -c 'import json; assert json.load(open("modules.json", encoding="utf-8"))'

  evidence:
    name: release evidence
    needs: [validate, quality, security, codeql, package, install]
    if: ${{ success() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-distributions
          path: evidence/artifacts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-sbom
          path: evidence
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-codeql-sarif
          path: evidence/codeql-sarif
      - name: Create evidence manifest
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          COMMIT_SHA: ${{ needs.validate.outputs.commit }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          jq -n \
            --arg release "$VERSION" \
            --arg commit "$COMMIT_SHA" \
            --arg run_url "$RUN_URL" \
            '{
              schema_version: 1,
              release: $release,
              commit: $commit,
              run_url: $run_url,
              gates: (
                [
                  "codeql",
                  "cross-platform-install",
                  "cyclonedx-sbom",
                  "dependency-audit",
                  "lifecycle-audit",
                  "project-release-gate",
                  "mypy",
                  "privacy-regressions",
                  "repository-safety",
                  "reproducible-distributions",
                  "ruff-format",
                  "secret-scan",
                  "semgrep",
                  "tests-and-coverage",
                  "workflow-security-analysis"
                ]
                | map({
                    name: .,
                    status: "verified",
                    evidence_url: $run_url
                  })
              )
            }' > evidence/gates.json
          cp "docs/release-evidence/$VERSION/findings.json" \
            evidence/findings-dispositions.json
          cp "docs/release-evidence/$VERSION/interoperability.json" \
            evidence/interoperability.json
          python scripts/create_release_evidence.py \
            --version "$VERSION" \
            --commit "$COMMIT_SHA" \
            --run-url "$RUN_URL" \
            --artifacts evidence/artifacts \
            --gates evidence/gates.json \
            --findings evidence/findings-dispositions.json \
            --interoperability evidence/interoperability.json \
            --output evidence/release-evidence.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence
          path: evidence/
          if-no-files-found: error
          retention-days: 90
