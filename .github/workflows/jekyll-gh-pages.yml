# Build and deploy the canonical documentation source to GitHub Pages.
name: Deploy documentation site

on:
  push:
    branches: ["main"]

  workflow_dispatch:

# Build jobs only need repository read access. Deployment credentials are scoped
# to the deploy job below.
permissions:
  contents: read

# Allow only one deployment; do not interrupt a publication in progress.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build GitHub Pages site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Prepare canonical documentation for Pages
        run: python scripts/prepare_pages_source.py --source docs --destination _pages_source
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ./_pages_source
          destination: ./_site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./_site

  deploy:
    name: Deploy GitHub Pages site
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write # Publish the prepared artifact to GitHub Pages.
      id-token: write # Authenticate this deployment with GitHub Pages.
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
