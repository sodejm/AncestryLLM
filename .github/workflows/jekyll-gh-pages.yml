# Build and deploy the canonical documentation source to GitHub Pages.
name: Deploy documentation site

on:
  push:
    branches: ["main"]

  workflow_dispatch:

# Build jobs only need repository read access. Deployment credentials are scoped
# to the deploy job below.
permissions:
  contents: read

# Allow only one deployment; do not interrupt a publication in progress.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build GitHub Pages site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Prepare canonical documentation for Pages
        run: python scripts/prepare_pages_source.py --source docs --destination _pages_source
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ./_pages_source
          destination: ./_site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ./_site

  deploy:
    name: Deploy GitHub Pages site
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write # Publish the prepared artifact to GitHub Pages.
      id-token: write # Authenticate this deployment with GitHub Pages.
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v5
