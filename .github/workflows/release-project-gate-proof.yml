# Proves release-project status checks independently of production release execution.
name: Release Project gate proof

on:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release-project-gate-proof-${{ github.sha }}
  cancel-in-progress: false

jobs:
  validate:
    name: prove exact-main Project gate access
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      attestations: read # required by the verified uv provenance preflight
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact main commit and private Project schema
        env:
          GH_TOKEN: ${{ github.token }}
          PROJECT_READ_TOKEN: ${{ secrets.ANCESTRYLLM_PROJECT_READ_TOKEN }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test "$(git rev-parse origin/main)" = "$EXPECTED_COMMIT"
          project_release="$(jq -er '.release' .github/release-config.json)"
          python scripts/verify_release_configuration.py \
            --config .github/release-config.json \
            --version "$project_release"
          project_owner="$(jq -r '.project.owner' .github/release-config.json)"
          project_number="$(jq -r '.project.number' .github/release-config.json)"
          project_title="$(jq -r '.project.title' .github/release-config.json)"
          project_iteration="$(jq -r '.project.iteration' .github/release-config.json)"
          project_status="$(jq -r '.project.status' .github/release-config.json)"
          project_validation="$(jq -r '.project.validation' .github/release-config.json)"
          project_repository="${GITHUB_REPOSITORY#*/}"
          project_milestone_number="$(jq -r '.project.milestone.number // 1' .github/release-config.json)"
          project_include_milestone="false"
          project_priority_args=()
          while IFS= read -r project_priority; do
            project_priority_args+=(--priority "$project_priority")
          done < <(jq -r '(.project.priorities // [.project.priority])[]' .github/release-config.json)
          project_milestone_args=()
          if test "$(jq -r '.schema_version' .github/release-config.json)" -eq 3; then
            project_include_milestone="true"
            project_milestone_title="$(jq -r '.project.milestone.title' .github/release-config.json)"
            project_milestone_args=(
              --repository "$project_repository"
              --milestone-number "$project_milestone_number"
              --milestone-title "$project_milestone_title"
            )
          fi
          project_query="$(< config/release-project-query-v1.graphql)"
          mkdir -p "$RUNNER_TEMP/version-1-security-gate"
          test -n "$PROJECT_READ_TOKEN" || {
            echo "Missing required Actions secret ANCESTRYLLM_PROJECT_READ_TOKEN for private Project read access." >&2
            exit 1
          }
          GH_TOKEN="$PROJECT_READ_TOKEN" gh api graphql --paginate --slurp \
            -f query="$project_query" \
            -f owner="$project_owner" \
            -F number="$project_number" \
            -f repository="$project_repository" \
            -F milestoneNumber="$project_milestone_number" \
            -F includeMilestone="$project_include_milestone" |
            python scripts/verify_release_project.py \
              --schema-only \
              --project-owner "$project_owner" \
              --project-number "$project_number" \
              --project-title "$project_title" \
              --iteration "$project_iteration" \
              "${project_priority_args[@]}" \
              --status "$project_status" \
              --validation "$project_validation" \
              "${project_milestone_args[@]}" \
              --security-policy config/version-1-security-policy.json \
              --security-report "$RUNNER_TEMP/version-1-security-gate/report.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: version-1-security-gate-proof
          path: ${{ runner.temp }}/version-1-security-gate/report.json
          if-no-files-found: error
          retention-days: 90
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up verified uv
        uses: ./.github/actions/setup-verified-uv
        with:
          python-version: "3.12"
          receipt-artifact-name: uv-bootstrap-release-project-proof
      - name: Prove strict verifier rejects a non-ready configured-priority fixture
        run: |
          uv sync --locked --no-default-groups --group test
          uv run --no-sync python -m pytest tests/test_verify_release_project.py -q
