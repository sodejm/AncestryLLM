name: Desktop verification

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full immutable commit SHA to verify
        required: true
        type: string

concurrency:
  group: desktop-verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  EXPECTED_HEAD: ${{ inputs.commit_sha || github.sha }}

jobs:
  changes:
    name: Desktop change classifier
    runs-on: ubuntu-24.04
    outputs:
      desktop: ${{ steps.classify.outputs.desktop }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify and classify the exact head
        id: classify
        shell: bash
        run: |
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$EXPECTED_HEAD" = "$(git rev-parse refs/remotes/origin/main)"
          echo "desktop=true" >> "$GITHUB_OUTPUT"

  desktop-security:
    name: Desktop contract and security
    needs: changes
    if: ${{ needs.changes.outputs.desktop == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha || github.sha }}
          persist-credentials: false
      - name: Verify exact head
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.5.0"
      - uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        with:
          version: "11.9.0"
      - name: Install locked dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check uv==0.12.1
          uv sync --locked --all-extras
          pnpm --dir desktop install --frozen-lockfile
      - name: Verify API and workflow contracts
        shell: bash
        env:
          RECEIPTS_DIR: desktop/verification/security/receipts
        run: |
          node desktop/scripts/verification-receipt.mjs \
            --git-head "$EXPECTED_HEAD" \
            --output "$RECEIPTS_DIR/api-contract.json" \
            --gate apiContractPassed \
            --gate authBeforeParsingPassed \
            --gate domainRoutesAbsentPassed \
            --gate providerNoneNetworkFreePassed \
            --gate redactionPassed \
            -- uv run python -m pytest tests/api tests/test_build_verification_sidecar.py tests/test_desktop_workflow_contract.py tests/test_verification_wrong_sidecar.py
      - name: Verify desktop source
        shell: bash
        run: |
          pnpm --dir desktop run lint
          pnpm --dir desktop run typecheck
      - name: Verify desktop tests
        shell: bash
        env:
          RECEIPTS_DIR: desktop/verification/security/receipts
        run: >-
          node desktop/scripts/verification-receipt.mjs
          --git-head "$EXPECTED_HEAD"
          --output "$RECEIPTS_DIR/desktop-tests.json"
          --allow-output "$RECEIPTS_DIR/api-contract.json"
          --gate ipcSenderValidationPassed
          -- pnpm --dir desktop run test
      - name: Verify production build inspection
        shell: bash
        env:
          RECEIPTS_DIR: desktop/verification/security/receipts
        run: >-
          node desktop/scripts/verification-receipt.mjs
          --git-head "$EXPECTED_HEAD"
          --output "$RECEIPTS_DIR/build-inspection.json"
          --allow-output "$RECEIPTS_DIR/api-contract.json"
          --allow-output "$RECEIPTS_DIR/desktop-tests.json"
          --gate buildInspectionPassed
          -- pnpm --dir desktop run build
      - name: Verify dependency audit
        shell: bash
        env:
          RECEIPTS_DIR: desktop/verification/security/receipts
        run: >-
          node desktop/scripts/verification-receipt.mjs
          --git-head "$EXPECTED_HEAD"
          --output "$RECEIPTS_DIR/audit.json"
          --allow-output "$RECEIPTS_DIR/api-contract.json"
          --allow-output "$RECEIPTS_DIR/desktop-tests.json"
          --allow-output "$RECEIPTS_DIR/build-inspection.json"
          --gate auditPassed
          -- pnpm --dir desktop run audit
      - name: Verify secret scan
        shell: bash
        env:
          RECEIPTS_DIR: desktop/verification/security/receipts
        run: >-
          node desktop/scripts/verification-receipt.mjs
          --git-head "$EXPECTED_HEAD"
          --output "$RECEIPTS_DIR/secrets.json"
          --allow-output "$RECEIPTS_DIR/api-contract.json"
          --allow-output "$RECEIPTS_DIR/desktop-tests.json"
          --allow-output "$RECEIPTS_DIR/build-inspection.json"
          --allow-output "$RECEIPTS_DIR/audit.json"
          --gate secretsPassed
          -- pnpm --dir desktop run check:secrets
      - name: Generate and bind the software inventory
        shell: bash
        env:
          RECEIPTS_DIR: desktop/verification/security/receipts
          SECURITY_ROOT: desktop/verification/security
        run: |
          node desktop/scripts/verification-receipt.mjs \
            --git-head "$EXPECTED_HEAD" \
            --output "$RECEIPTS_DIR/sbom.json" \
            --allow-output "$RECEIPTS_DIR/api-contract.json" \
            --allow-output "$RECEIPTS_DIR/desktop-tests.json" \
            --allow-output "$RECEIPTS_DIR/build-inspection.json" \
            --allow-output "$RECEIPTS_DIR/audit.json" \
            --allow-output "$RECEIPTS_DIR/secrets.json" \
            --gate sbomGeneratedPassed \
            --artifact sbom=desktop/sbom.cdx.json \
            -- pnpm --dir desktop run sbom
          cp desktop/sbom.cdx.json "$SECURITY_ROOT/sbom.cdx.json"
      - name: Record security evidence
        shell: bash
        env:
          RECEIPTS_DIR: desktop/verification/security/receipts
          SECURITY_ROOT: desktop/verification/security
        run: |
          node desktop/scripts/verification-evidence.mjs security \
            --git-head "$EXPECTED_HEAD" \
            --sbom "$SECURITY_ROOT/sbom.cdx.json" \
            --receipts "$RECEIPTS_DIR" \
            --output "$SECURITY_ROOT/security.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-evidence-security
          path: desktop/verification
          if-no-files-found: error

  native-package:
    name: ${{ matrix.name }}
    needs: changes
    if: ${{ needs.changes.outputs.desktop == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS 15 arm64
            runner: macos-15
            runs_on: '["macos-15"]'
            sidecar_target: darwin-arm64
            expected_os: "macOS 15"
            arch: arm64
            runtime_arch: arm64
            package_boundary: unpacked-native
            package_args: --mac --dir --arm64
          - name: macOS 15 x64
            runner: macos-15-intel
            runs_on: '["macos-15-intel"]'
            sidecar_target: darwin-x64
            expected_os: "macOS 15"
            arch: x64
            runtime_arch: x64
            package_boundary: unpacked-native
            package_args: --mac --dir --x64
          - name: macOS 26 arm64
            runner: macos-26
            runs_on: '["macos-26"]'
            sidecar_target: darwin-arm64
            expected_os: "macOS 26"
            arch: arm64
            runtime_arch: arm64
            package_boundary: unpacked-native
            package_args: --mac --dir --arm64
          - name: macOS 26 x64
            runner: macos-26-intel
            runs_on: '["macos-26-intel"]'
            sidecar_target: darwin-x64
            expected_os: "macOS 26"
            arch: x64
            runtime_arch: x64
            package_boundary: unpacked-native
            package_args: --mac --dir --x64
          - name: Windows 11 ARM64 host / x64 package
            runner: windows-11-arm
            runs_on: '["windows-11-arm"]'
            sidecar_target: win32-x64
            expected_os: "Windows 11"
            arch: x64
            host_arch: arm64
            runtime_arch: x64
            package_boundary: unpacked-native
            package_args: --win --dir --x64
          - name: Ubuntu 24.04 x64
            runner: ubuntu-24.04
            runs_on: '["ubuntu-24.04"]'
            sidecar_target: linux-x64
            expected_os: "Ubuntu 24.04"
            arch: x64
            runtime_arch: x64
            package_boundary: unpacked-native
            package_args: --linux --dir --x64
    runs-on: ${{ fromJSON(matrix.runs_on) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha || github.sha }}
          persist-credentials: false
      - name: Verify exact head
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - id: macos-host
        name: Verify supported macOS version
        if: runner.os == 'macOS'
        shell: bash
        env:
          EXPECTED_OS: ${{ matrix.expected_os }}
        run: |
          actual_os="macOS $(sw_vers -productVersion | cut -d. -f1)"
          test "$actual_os" = "$EXPECTED_OS"
          echo "actual_os=$actual_os" >> "$GITHUB_OUTPUT"
      - id: windows-host
        name: Verify exact Windows 11 host
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          EXPECTED_OS: ${{ matrix.expected_os }}
          EXPECTED_HOST_ARCH: ${{ matrix.host_arch || matrix.arch }}
        run: |
          $caption = (Get-CimInstance Win32_OperatingSystem).Caption
          if ($caption -notmatch 'Windows 11') { throw "expected Windows 11, found $caption" }
          $hostArch = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
          if ($hostArch -ne $env:EXPECTED_HOST_ARCH) {
            throw "expected host architecture $env:EXPECTED_HOST_ARCH, found $hostArch"
          }
          $actualOs = 'Windows 11'
          if ($actualOs -ne $env:EXPECTED_OS) {
            throw "expected $env:EXPECTED_OS, found $caption"
          }
          "actual_os=$actualOs" >> $env:GITHUB_OUTPUT
      - id: linux-host
        name: Verify exact Ubuntu 24.04 host
        if: runner.os == 'Linux'
        shell: bash
        env:
          EXPECTED_OS: ${{ matrix.expected_os }}
        run: |
          source /etc/os-release
          test "$ID" = ubuntu
          actual_os="Ubuntu $VERSION_ID"
          test "$actual_os" = "$EXPECTED_OS"
          echo "actual_os=$actual_os" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          architecture: ${{ matrix.runtime_arch }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.5.0"
          architecture: ${{ matrix.runtime_arch }}
      - uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        with:
          version: "11.9.0"
      - name: Install locked dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check uv==0.12.1
          uv sync --locked --all-extras
          pnpm --dir desktop install --frozen-lockfile
      - name: Build and smoke-test native sidecar
        shell: bash
        env:
          ROW_ROOT: desktop/verification/${{ matrix.runner }}
          SIDECAR_TARGET: ${{ matrix.sidecar_target }}
          RECEIPTS_DIR: desktop/verification/${{ matrix.runner }}/receipts
        run: |
          uv run python scripts/build_sidecar.py --expected-target "$SIDECAR_TARGET"
          sidecar_executable="desktop/build/sidecar/$SIDECAR_TARGET/ancestryllm-sidecar/ancestryllm-sidecar"
          if [[ "$SIDECAR_TARGET" == "win32-x64" ]]; then sidecar_executable="$sidecar_executable.exe"; fi
          node desktop/scripts/verification-receipt.mjs \
            --git-head "$EXPECTED_HEAD" \
            --output "$RECEIPTS_DIR/sidecar-smoke.json" \
            --gate sidecarSmokePassed \
            -- uv run python scripts/smoke_sidecar.py "$sidecar_executable"
          uv run python scripts/build_verification_sidecar.py --expected-target "$SIDECAR_TARGET"
          wrong_build_sidecar="$GITHUB_WORKSPACE/desktop/build/verification-sidecar/$SIDECAR_TARGET/ancestryllm-wrong-build-sidecar"
          if [[ "$SIDECAR_TARGET" == "win32-x64" ]]; then wrong_build_sidecar="$wrong_build_sidecar.exe"; fi
          echo "ANCESTRYLLM_WRONG_BUILD_SIDECAR=$wrong_build_sidecar" >> "$GITHUB_ENV"
      - name: Build production Electron application
        shell: bash
        run: pnpm --dir desktop run build
      - name: Assemble unpublished unpacked native application
        shell: bash
        env:
          PACKAGE_ARGS: ${{ matrix.package_args }}
        run: pnpm --dir desktop exec electron-builder --config electron-builder.verification.yml $PACKAGE_ARGS
      - name: Verify packaged sidecar resource
        shell: bash
        env:
          SIDECAR_TARGET: ${{ matrix.sidecar_target }}
        run: node desktop/scripts/verify-sidecar.mjs "$SIDECAR_TARGET" desktop/release
      - name: Prepare Chromium sandbox for unpacked Linux verification
        if: runner.os == 'Linux'
        shell: bash
        run: |
          packaged_app="$(node desktop/scripts/find-packaged-app.mjs)"
          sandbox_path="$(dirname "$packaged_app")/chrome-sandbox"
          case "$sandbox_path" in
            "$GITHUB_WORKSPACE/desktop/release"/*) ;;
            *)
              echo "::error::Unexpected Chromium sandbox path"
              exit 1
              ;;
          esac
          test ! -L "$sandbox_path"
          test -f "$sandbox_path"
          sudo chown root:root -- "$sandbox_path"
          sudo chmod 4755 -- "$sandbox_path"
          test "$(stat -c '%U:%G:%a' -- "$sandbox_path")" = "root:root:4755"
      - name: Exercise the packaged application
        shell: bash
        env:
          ROW_ROOT: desktop/verification/${{ matrix.runner }}
          RECEIPTS_DIR: desktop/verification/${{ matrix.runner }}/receipts
        run: |
          packaged_app="$(node desktop/scripts/find-packaged-app.mjs)"
          mkdir -p "$ROW_ROOT"
          export ANCESTRYLLM_PACKAGED_APP="$packaged_app"
          export ANCESTRYLLM_PACKAGED_METRICS="$GITHUB_WORKSPACE/$ROW_ROOT/packaged-metrics.json"
          export ANCESTRYLLM_WITHHOLD_EVIDENCE="$GITHUB_WORKSPACE/$ROW_ROOT/sidecar-withhold-retry.json"
          export ANCESTRYLLM_RESTART_EVIDENCE="$GITHUB_WORKSPACE/$ROW_ROOT/sidecar-restart-exhaustion-quit.json"
          export ANCESTRYLLM_MISMATCH_EVIDENCE="$GITHUB_WORKSPACE/$ROW_ROOT/sidecar-version-mismatch.json"
          export ANCESTRYLLM_MISMATCH_DIAGNOSTICS="$GITHUB_WORKSPACE/$ROW_ROOT/sidecar-version-mismatch-diagnostics.json"
          package_launcher=()
          if [[ "$RUNNER_OS" == "Linux" ]]; then package_launcher=(xvfb-run --auto-servernum); fi
          node desktop/scripts/verification-receipt.mjs \
            --git-head "$EXPECTED_HEAD" \
            --output "$RECEIPTS_DIR/packaged-runtime.json" \
            --allow-output "$RECEIPTS_DIR/sidecar-smoke.json" \
            --gate packageRuntimePassed \
            --gate rendererZeroEgressCanaryPassed \
            --gate normalLaunchDebugSurfaceAbsentPassed \
            --artifact metrics="$ANCESTRYLLM_PACKAGED_METRICS" \
            -- "${package_launcher[@]}" pnpm --dir desktop run test:e2e:packaged \
              --grep "exercises first run, persistence, corrupt preferences, security, and resource evidence"
          node desktop/scripts/verification-receipt.mjs \
            --git-head "$EXPECTED_HEAD" \
            --output "$RECEIPTS_DIR/packaged-sidecar-withhold-retry.json" \
            --allow-output "$RECEIPTS_DIR/sidecar-smoke.json" \
            --allow-output "$RECEIPTS_DIR/packaged-runtime.json" \
            --allow-output "$ANCESTRYLLM_PACKAGED_METRICS" \
            --gate packagedSidecarWithholdRetryPassed \
            --artifact faultEvidence="$ANCESTRYLLM_WITHHOLD_EVIDENCE" \
            -- "${package_launcher[@]}" pnpm --dir desktop run test:e2e:packaged \
              --grep "withholds and restores the packaged sidecar through Diagnostics retry"
          node desktop/scripts/verification-receipt.mjs \
            --git-head "$EXPECTED_HEAD" \
            --output "$RECEIPTS_DIR/packaged-sidecar-restart-exhaustion-quit.json" \
            --allow-output "$RECEIPTS_DIR/sidecar-smoke.json" \
            --allow-output "$RECEIPTS_DIR/packaged-runtime.json" \
            --allow-output "$RECEIPTS_DIR/packaged-sidecar-withhold-retry.json" \
            --allow-output "$ANCESTRYLLM_PACKAGED_METRICS" \
            --allow-output "$ANCESTRYLLM_WITHHOLD_EVIDENCE" \
            --gate packagedSidecarRestartExhaustionQuitPassed \
            --artifact faultEvidence="$ANCESTRYLLM_RESTART_EVIDENCE" \
            -- "${package_launcher[@]}" pnpm --dir desktop run test:e2e:packaged \
              --grep "restarts a killed packaged sidecar, exhausts the budget, and cleans up on quit"
          node desktop/scripts/verification-receipt.mjs \
            --git-head "$EXPECTED_HEAD" \
            --output "$RECEIPTS_DIR/packaged-sidecar-version-mismatch.json" \
            --allow-output "$RECEIPTS_DIR/sidecar-smoke.json" \
            --allow-output "$RECEIPTS_DIR/packaged-runtime.json" \
            --allow-output "$RECEIPTS_DIR/packaged-sidecar-withhold-retry.json" \
            --allow-output "$RECEIPTS_DIR/packaged-sidecar-restart-exhaustion-quit.json" \
            --allow-output "$ANCESTRYLLM_PACKAGED_METRICS" \
            --allow-output "$ANCESTRYLLM_WITHHOLD_EVIDENCE" \
            --allow-output "$ANCESTRYLLM_RESTART_EVIDENCE" \
            --gate packagedSidecarVersionMismatchPassed \
            --artifact faultEvidence="$ANCESTRYLLM_MISMATCH_EVIDENCE" \
            --artifact wrongBuildSidecar="$ANCESTRYLLM_WRONG_BUILD_SIDECAR" \
            -- "${package_launcher[@]}" pnpm --dir desktop run test:e2e:packaged \
              --grep "rejects a target-native wrong-build packaged sidecar"
      - name: Inspect packaged Electron fuses
        shell: bash
        env:
          ROW_ROOT: desktop/verification/${{ matrix.runner }}
          RECEIPTS_DIR: desktop/verification/${{ matrix.runner }}/receipts
        run: |
          node desktop/scripts/verification-receipt.mjs \
            --git-head "$EXPECTED_HEAD" \
            --output "$RECEIPTS_DIR/fuse-inspection.json" \
            --allow-output "$RECEIPTS_DIR/sidecar-smoke.json" \
            --allow-output "$RECEIPTS_DIR/packaged-runtime.json" \
            --allow-output "$RECEIPTS_DIR/packaged-sidecar-withhold-retry.json" \
            --allow-output "$RECEIPTS_DIR/packaged-sidecar-restart-exhaustion-quit.json" \
            --allow-output "$RECEIPTS_DIR/packaged-sidecar-version-mismatch.json" \
            --allow-output "$ROW_ROOT/packaged-metrics.json" \
            --allow-output "$ROW_ROOT/sidecar-withhold-retry.json" \
            --allow-output "$ROW_ROOT/sidecar-restart-exhaustion-quit.json" \
            --allow-output "$ROW_ROOT/sidecar-version-mismatch.json" \
            --gate fusesInspectedPassed \
            --artifact fuseInspection="$ROW_ROOT/fuse-inspection.json" \
            -- node desktop/scripts/inspect-package-fuses.mjs --output "$ROW_ROOT/fuse-inspection.json"
      - name: Record target evidence
        shell: bash
        env:
          SIDECAR_TARGET: ${{ matrix.sidecar_target }}
          EXPECTED_OS: ${{ matrix.expected_os }}
          ACTUAL_OS: ${{ steps.macos-host.outputs.actual_os || steps.windows-host.outputs.actual_os || steps.linux-host.outputs.actual_os }}
          TARGET_ARCH: ${{ matrix.arch }}
          PACKAGE_BOUNDARY: ${{ matrix.package_boundary }}
          VERIFICATION_RUNNER: ${{ matrix.runner }}
          ROW_ROOT: desktop/verification/${{ matrix.runner }}
          RECEIPTS_DIR: desktop/verification/${{ matrix.runner }}/receipts
        run: |
          node desktop/scripts/verification-evidence.mjs target \
            --git-head "$EXPECTED_HEAD" \
            --runner "$VERIFICATION_RUNNER" \
            --sidecar-target "$SIDECAR_TARGET" \
            --expected-os "$EXPECTED_OS" \
            --actual-os "$ACTUAL_OS" \
            --arch "$TARGET_ARCH" \
            --package-boundary "$PACKAGE_BOUNDARY" \
            --metrics "$ROW_ROOT/packaged-metrics.json" \
            --fuse-inspection "$ROW_ROOT/fuse-inspection.json" \
            --withhold-evidence "$ROW_ROOT/sidecar-withhold-retry.json" \
            --restart-evidence "$ROW_ROOT/sidecar-restart-exhaustion-quit.json" \
            --mismatch-evidence "$ROW_ROOT/sidecar-version-mismatch.json" \
            --receipts "$RECEIPTS_DIR" \
            --output "$ROW_ROOT/target.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: desktop-evidence-${{ matrix.runner }}
          path: desktop/verification
          if-no-files-found: warn

  desktop-gate:
    name: Desktop gate
    if: ${{ always() }}
    needs: [changes, desktop-security, native-package]
    runs-on: ubuntu-24.04
    steps:
      - name: Validate prerequisite results
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          DESKTOP_CHANGED: ${{ needs.changes.outputs.desktop }}
          SECURITY_RESULT: ${{ needs.desktop-security.result }}
          PACKAGE_RESULT: ${{ needs.native-package.result }}
        run: |
          test "$CHANGES_RESULT" = "success"
          if [[ "$DESKTOP_CHANGED" == "true" ]]; then
            test "$SECURITY_RESULT" = "success"
            test "$PACKAGE_RESULT" = "success"
          else
            test "$DESKTOP_CHANGED" = "false"
            test "$SECURITY_RESULT" = "skipped"
            test "$PACKAGE_RESULT" = "skipped"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.desktop == 'true'
        with:
          ref: ${{ inputs.commit_sha || github.sha }}
          persist-credentials: false
      - name: Verify exact head
        if: needs.changes.outputs.desktop == 'true'
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: needs.changes.outputs.desktop == 'true'
        with:
          node-version: "26.5.0"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.changes.outputs.desktop == 'true'
        with:
          pattern: desktop-evidence-*
          merge-multiple: true
          path: evidence
      - name: Aggregate exact-head evidence
        if: needs.changes.outputs.desktop == 'true'
        shell: bash
        run: node desktop/scripts/verification-evidence.mjs aggregate --git-head "$EXPECTED_HEAD" --root evidence --output desktop-evidence.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: needs.changes.outputs.desktop == 'true'
        with:
          name: desktop-evidence-aggregate
          path: desktop-evidence.json
          if-no-files-found: error
