# Applies repository labels to newly opened issues from their submitted content.
name: Issue Labeler

on:
  issues:
    types: [opened]

permissions: {}

concurrency:
  group: issue-labeler-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  label:
    name: label new issue
    runs-on: ubuntu-latest
    permissions:
      contents: read # required to read the labeler configuration
      issues: write # required to apply repository issue labels
    steps:
      - name: Label issue from work type
        uses: github/issue-labeler@c1b0f9f52a63158c4adc09425e858e87b32e9685 # v3.4
        with:
          configuration-path: .github/issue-labeler.yml
          enable-versioned-regex: 0
          include-title: 0
          repo-token: ${{ github.token }}
