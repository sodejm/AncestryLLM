[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "ancestryllm"
version = "0.5.0"
description = "Local-first, privacy-preserving genealogy CLI with modular LLM providers."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "MIT"
authors = [{name = "Justin Soderberg"}]
keywords = ["cli", "gedcom", "genealogy", "rootsmagic", "privacy", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Sociology :: Genealogy",
]
dependencies = [
    "alembic>=1.18,<2",
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "jsonschema>=4.25.1,<4.27",
    "keyring>=25.7,<26",
    "platformdirs>=4.5,<5",
    "prompt-toolkit>=3.0.52,<4",
    "pydantic>=2.12,<3",
    "python-dateutil>=2.9,<3",
    "rapidfuzz>=3.14,<4",
    "rich>=15,<16",
    "sqlalchemy>=2.0,<3",
    "sqlcipher3>=0.6.2,<0.7",
    "sqlglot>=28,<31",
    "tomli-w>=1.2,<2",
    "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
ollama = ["ollama>=0.6,<1"]
openai = ["openai>=2.45,<3"]
anthropic = ["anthropic>=0.71,<1"]
gemini = ["google-genai>=2.12,<3"]
openrouter = ["openai>=2.45,<3"]
all-llm = [
    "anthropic>=0.71,<1",
    "google-genai>=2.12,<3",
    "ollama>=0.6,<1",
    "openai>=2.45,<3",
]
desktop-build = ["pyinstaller>=6.17,<7"]

[dependency-groups]
lint = [
    "ruff>=0.15,<1",
    "pre-commit>=4.5,<5",
]
typecheck = [
    "mypy>=1.19,<3",
    "types-python-dateutil>=2.9,<3",
    "ty==0.0.69",
]
test = [
    "coverage[toml]>=7.12,<8",
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "pytest-mock>=3.15,<4",
]
security = [
    "cyclonedx-bom>=7.2,<8",
    "pip-audit>=2.10,<3",
    "zizmor==1.29.0",
]
build = [
    "build>=1.3,<2",
    "check-wheel-contents>=0.6.1,<1",
    "packaging>=25,<27",
    "setuptools>=83,<84",
    "twine>=6.2,<8",
    "wheel>=0.45,<1",
]
release-verifier = ["pypi-attestations==0.0.30"]

[tool.uv]
required-version = "==0.12.1"
python-preference = "only-system"
python-downloads = "never"

[project.urls]
Homepage = "https://github.com/sodejm/AncestryLLM"
Documentation = "https://sodejm.github.io/AncestryLLM/"
Repository = "https://github.com/sodejm/AncestryLLM"
Issues = "https://github.com/sodejm/AncestryLLM/issues"
Changelog = "https://github.com/sodejm/AncestryLLM/blob/main/CHANGELOG.md"
Security = "https://github.com/sodejm/AncestryLLM/security/policy"

[project.scripts]
ancestry = "ancestryllm.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ancestryllm.storage.migrations" = ["*.py", "versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"
filterwarnings = [
    "error::ResourceWarning",
]

[tool.coverage.run]
branch = true
source = ["ancestryllm"]

[tool.coverage.report]
show_missing = true
skip_covered = true
# Ratchet from the characterized GEDCOM façade corpus; raise with focused tests.
fail_under = 75

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "BLE", "S", "RUF", "TC", "PERF", "C4", "FURB"]
ignore = ["E501", "S101"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["RUF003", "RUF059", "S105", "S106", "S108", "S603", "S607"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["ancestryllm"]
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "anthropic",
    "gedcom.*",
    "google",
    "google.*",
    "jsonschema",
    "ollama",
    "openai",
    "sqlcipher3",
]
ignore_missing_imports = true
